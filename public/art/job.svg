<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 160" fill="none">
  <defs>
    <linearGradient id="a" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f97316"/><stop offset="1" stop-color="#ef4444"/></linearGradient>
    <filter id="g" x="-40%" y="-80%" width="180%" height="260%"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>
    .card{fill:#fff;fill-opacity:.07;stroke:#fff;stroke-opacity:.4;stroke-width:1.5}
    .fill{fill:url(#a);transform-box:fill-box;transform-origin:left;animation:p 4s cubic-bezier(.2,.7,.2,1) infinite}
    @keyframes p{0%{transform:scaleX(.05)}75%,100%{transform:scaleX(1)}}
    .count{font:700 22px ui-monospace,Menlo,monospace;fill:#fff}
    .lbl{font:600 10px system-ui,sans-serif;fill:#fff;fill-opacity:.6;letter-spacing:.1em}
    .chip{fill:#f97316;fill-opacity:.25;stroke:#f97316;stroke-opacity:.6}
    .pulse{fill:#f97316;transform-box:fill-box;transform-origin:center;animation:u 1.6s ease-out infinite}
    @keyframes u{from{transform:scale(.6);opacity:1}to{transform:scale(2);opacity:0}}
  </style>
  <!-- a job: its target, and the parts made toward it -->
  <rect class="card" x="150" y="26" width="182" height="110" rx="12"/>
  <text class="lbl" x="166" y="50">JOB · WO-1042</text>
  <text class="count" x="166" y="82">380<tspan style="font-size:13px;fill-opacity:.55"> / 450</tspan></text>
  <rect x="166" y="96" width="150" height="10" rx="5" fill="#fff" fill-opacity=".12"/>
  <rect class="fill" x="166" y="96" width="150" height="10" rx="5" filter="url(#g)"/>
  <rect class="chip" x="166" y="114" width="64" height="14" rx="7"/><text class="lbl" x="174" y="124" style="font-size:8px">RUNNING</text>
  <circle class="pulse" cx="312" cy="46" r="5"/><circle cx="312" cy="46" r="5" fill="#f97316"/>
  <g transform="translate(40 44)" stroke="#fff" stroke-opacity=".35" stroke-width="3" stroke-linecap="round"><path d="M0 0h76"/><path d="M0 24h58"/><path d="M0 48h68"/></g>
</svg>
