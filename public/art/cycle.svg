<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 160" fill="none">
  <defs>
    <linearGradient id="a" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a855f7"/><stop offset="1" stop-color="#ec4899"/></linearGradient>
    <filter id="g" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2.8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>
    .spin{transform-origin:240px 80px;animation:s 7s linear infinite}
    @keyframes s{to{transform:rotate(360deg)}}
    .gear{transform-origin:240px 80px;animation:r 7s linear infinite reverse}
    @keyframes r{to{transform:rotate(360deg)}}
    .arc{stroke:url(#a);stroke-width:5;stroke-linecap:round}
    .line{stroke:#fff;stroke-opacity:.5;stroke-width:1.6}
    .item{fill:#fff;fill-opacity:.12}
    .done{stroke:#ec4899;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:20;stroke-dashoffset:20;animation:d 3.5s ease-in-out infinite}
    .done.b{animation-delay:.6s}.done.c{animation-delay:1.2s}
    @keyframes d{0%,20%{stroke-dashoffset:20}40%,85%{stroke-dashoffset:0}100%{stroke-dashoffset:20}}
  </style>
  <!-- recurring checks: the cycle turns, the list ticks itself off -->
  <g class="spin" filter="url(#g)">
    <path class="arc" d="M240 30a50 50 0 0 1 48 36"/><path d="M290 58l-2 10-9-4" stroke="#ec4899" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path class="arc" d="M240 130a50 50 0 0 1-48-36"/><path d="M190 102l2-10 9 4" stroke="#a855f7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g class="gear">
    <path class="line" d="M240 58l6 1 3-7 7 3-1 7 5 4 7-3 3 7-6 4v6l6 4-3 7-7-3-5 4 1 7-7 3-3-7-6 1-6-1-3 7-7-3 1-7-5-4-7 3-3-7 6-4v-6l-6-4 3-7 7 3 5-4-1-7 7-3 3 7Z"/>
    <circle class="line" cx="240" cy="80" r="9"/>
  </g>
  <g transform="translate(40 36)">
    <rect class="item" x="0" y="0" width="112" height="20" rx="6"/><rect class="item" x="0" y="32" width="112" height="20" rx="6"/><rect class="item" x="0" y="64" width="112" height="20" rx="6"/>
    <path class="done" d="M8 10l5 5 8-9"/><path class="done b" d="M8 42l5 5 8-9"/><path class="done c" d="M8 74l5 5 8-9"/>
    <path d="M32 10h66M32 42h54M32 74h60" stroke="#fff" stroke-opacity=".35" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
