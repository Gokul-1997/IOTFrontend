<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 160" fill="none">
  <defs>
    <filter id="g" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>
    .frame{stroke:#fff;stroke-opacity:.5;stroke-width:1.6}
    .cell{fill:#fff;fill-opacity:.07;animation:c 5s ease-in-out infinite}
    @keyframes c{0%,100%{fill-opacity:.07}8%,22%{fill:#0ea5e9;fill-opacity:.85}}
    .tick{stroke:#fff;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:24;stroke-dashoffset:24;animation:k 5s ease-in-out infinite}
    @keyframes k{0%,30%{stroke-dashoffset:24}45%,90%{stroke-dashoffset:0}100%{stroke-dashoffset:24}}
    .hand{stroke:#6366f1;stroke-width:2.6;stroke-linecap:round;transform-origin:292px 92px;animation:h 6s linear infinite}
    @keyframes h{to{transform:rotate(360deg)}}
  </style>
  <!-- planned care: days lighting up in turn, one ticked off -->
  <rect class="frame" x="40" y="26" width="190" height="116" rx="12"/>
  <path class="frame" d="M40 52h190M76 18v16M194 18v16"/>
  <g>
    <rect class="cell" x="52" y="62" width="26" height="20" rx="5" style="animation-delay:0s"/>
    <rect class="cell" x="86" y="62" width="26" height="20" rx="5" style="animation-delay:.5s"/>
    <rect class="cell" x="120" y="62" width="26" height="20" rx="5" style="animation-delay:1s"/>
    <rect class="cell" x="154" y="62" width="26" height="20" rx="5" style="animation-delay:1.5s"/>
    <rect class="cell" x="188" y="62" width="26" height="20" rx="5" style="animation-delay:2s"/>
    <rect class="cell" x="52" y="88" width="26" height="20" rx="5" style="animation-delay:2.5s"/>
    <rect class="cell" x="86" y="88" width="26" height="20" rx="5" style="animation-delay:3s"/>
    <rect x="120" y="88" width="26" height="20" rx="5" fill="#0ea5e9" filter="url(#g)"/>
    <rect class="cell" x="154" y="88" width="26" height="20" rx="5" style="animation-delay:3.5s"/>
    <rect class="cell" x="188" y="88" width="26" height="20" rx="5" style="animation-delay:4s"/>
    <rect class="cell" x="52" y="114" width="26" height="20" rx="5" style="animation-delay:4.5s"/>
    <rect class="cell" x="86" y="114" width="26" height="20" rx="5" style="animation-delay:1.2s"/>
  </g>
  <path class="tick" d="M126 98l6 6 9-11"/>
  <circle cx="292" cy="92" r="40" stroke="#fff" stroke-opacity=".45" stroke-width="1.6"/>
  <circle cx="292" cy="92" r="32" stroke="#6366f1" stroke-opacity=".35" stroke-width="6" stroke-dasharray="4 8"/>
  <path class="hand" d="M292 92V64"/>
  <path d="M292 92l16 10" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
  <circle cx="292" cy="92" r="4" fill="#fff"/>
</svg>
