<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 160" fill="none">
  <defs>
    <linearGradient id="a" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2f7bff"/><stop offset="1" stop-color="#6a4dff"/></linearGradient>
    <filter id="g" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>
    .body{fill:#fff;fill-opacity:.06;stroke:#fff;stroke-opacity:.5;stroke-width:1.6}
    .glass{fill:#2f7bff;fill-opacity:.14;stroke:#fff;stroke-opacity:.35}
    .roof{fill:url(#a)}
    .fl{stroke:#fff;stroke-opacity:.8;stroke-width:1.3;animation:f .2s linear infinite}
    @keyframes f{to{transform:translateX(-5px)}}
    .table{animation:t 3s ease-in-out infinite alternate}
    @keyframes t{from{transform:translateX(-14px)}to{transform:translateX(14px)}}
    .lamp{fill:#22c55e;animation:l 2s ease-in-out infinite}
    @keyframes l{50%{fill-opacity:.35}}
    .twin{fill:#fff;fill-opacity:.05;stroke:#fff;stroke-opacity:.25;stroke-dasharray:4 5}
  </style>
  <!-- the machines on the floor -->
  <rect class="twin" x="238" y="46" width="92" height="82" rx="10"/><rect class="twin" x="250" y="34" width="92" height="82" rx="10"/>
  <rect class="body" x="90" y="34" width="150" height="104" rx="10"/>
  <rect class="roof" x="90" y="34" width="150" height="10" rx="5"/>
  <rect class="glass" x="102" y="52" width="92" height="72" rx="6"/>
  <rect x="140" y="56" width="24" height="24" rx="3" fill="#fff" fill-opacity=".55"/>
  <clipPath id="c"><rect x="148" y="80" width="8" height="18" rx="1.5"/></clipPath>
  <rect x="148" y="80" width="8" height="18" rx="1.5" fill="#e3e8ee"/>
  <g clip-path="url(#c)"><path class="fl" d="M138 98l12-18M143 98l12-18M148 98l12-18M153 98l12-18M158 98l12-18M163 98l12-18" /></g>
  <g class="table"><rect x="118" y="108" width="62" height="8" rx="2" fill="#fff" fill-opacity=".6"/><rect x="136" y="100" width="28" height="8" rx="1" fill="url(#a)"/></g>
  <rect x="202" y="54" width="30" height="66" rx="5" fill="#0b1220" stroke="#fff" stroke-opacity=".3"/>
  <rect x="207" y="60" width="20" height="14" rx="2" fill="#2f7bff" fill-opacity=".6"/>
  <circle class="lamp" cx="212" cy="108" r="3.4" filter="url(#g)"/><circle cx="222" cy="108" r="3.4" fill="#ef4444"/>
  <rect x="96" y="20" width="4" height="14" fill="#fff" fill-opacity=".45"/><rect x="92" y="10" width="12" height="10" rx="2" class="lamp" filter="url(#g)"/>
</svg>
