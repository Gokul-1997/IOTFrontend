<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 160" fill="none">
  <defs>
    <filter id="g" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>
    .shackle{stroke:#cbd5e1;stroke-width:8;stroke-linecap:round;animation:s 2.4s ease-in-out infinite}
    @keyframes s{0%,60%,100%{transform:translateY(0)}70%{transform:translateY(-6px)}80%{transform:translateY(0)}}
    .body{fill:#94a3b8}
    .ring{stroke:#6a4dff;stroke-opacity:.5;stroke-width:1.6;transform-box:fill-box;transform-origin:center;animation:r 3s ease-out infinite}
    @keyframes r{from{transform:scale(.7);opacity:1}to{transform:scale(1.5);opacity:0}}
  </style>
  <!-- a page this account does not open -->
  <circle class="ring" cx="258" cy="86" r="48"/>
  <path class="shackle" d="M238 72V56a20 20 0 0 1 40 0v16"/>
  <rect class="body" x="226" y="70" width="64" height="54" rx="10" filter="url(#g)"/>
  <circle cx="258" cy="93" r="7" fill="#0b0f15"/><path d="M258 98v12" stroke="#0b0f15" stroke-width="5" stroke-linecap="round"/>
</svg>
