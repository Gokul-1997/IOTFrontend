<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 160" fill="none">
  <defs>
    <linearGradient id="a" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f97316"/><stop offset="1" stop-color="#f59e0b"/></linearGradient>
    <filter id="g" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>
    .ring{stroke:#fff;stroke-opacity:.14;stroke-width:10}
    .prog{stroke:url(#a);stroke-width:10;stroke-linecap:round;transform-origin:262px 80px;transform:rotate(-90deg);stroke-dasharray:0 330;animation:p 4s ease-in-out infinite}
    @keyframes p{0%{stroke-dasharray:0 330}70%,100%{stroke-dasharray:250 330}}
    .bar{fill:#fff;animation:b 4s ease-in-out infinite}
    @keyframes b{0%,60%{opacity:1}70%{opacity:.4}80%{opacity:1}}
    .seg{fill:#fff;fill-opacity:.12}
    .stop{fill:url(#a);transform-box:fill-box;transform-origin:left;animation:s 4s ease-in-out infinite}
    @keyframes s{0%{transform:scaleX(0)}60%,100%{transform:scaleX(1)}}
  </style>
  <!-- a machine stopped: how long, and why -->
  <circle class="ring" cx="262" cy="80" r="52"/>
  <circle class="prog" cx="262" cy="80" r="52" filter="url(#g)"/>
  <rect class="bar" x="246" y="58" width="10" height="44" rx="3"/><rect class="bar" x="268" y="58" width="10" height="44" rx="3"/>
  <g transform="translate(34 50)">
    <rect class="seg" width="150" height="16" rx="5"/>
    <rect x="0" width="62" height="16" rx="5" fill="#16a34a" fill-opacity=".85"/>
    <rect class="stop" x="62" width="40" height="16"/>
    <rect x="102" width="48" height="16" rx="5" fill="#16a34a" fill-opacity=".85"/>
    <path d="M62 30v14M102 30v14" stroke="#f59e0b" stroke-width="2"/><path d="M62 37h40" stroke="#f59e0b" stroke-width="2" stroke-dasharray="3 3"/>
  </g>
</svg>
