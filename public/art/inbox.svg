<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 160" fill="none">
  <defs>
    <linearGradient id="a" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f97316"/><stop offset="1" stop-color="#ec4899"/></linearGradient>
    <filter id="g" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="2.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>
    .env{fill:#fff;fill-opacity:.08;stroke:#fff;stroke-opacity:.55;stroke-width:1.6;stroke-linejoin:round}
    .flap{stroke:#fff;stroke-opacity:.55;stroke-width:1.6;stroke-linejoin:round}
    .letter{fill:#fff;fill-opacity:.85;animation:u 3.6s ease-in-out infinite}
    @keyframes u{0%,20%{transform:translateY(22px)}45%,80%{transform:translateY(-6px)}100%{transform:translateY(22px)}}
    .badge{fill:url(#a);transform-box:fill-box;transform-origin:center;animation:b 1.8s cubic-bezier(.3,1.6,.5,1) infinite}
    @keyframes b{0%,100%{transform:scale(1)}20%{transform:scale(1.25)}40%{transform:scale(1)}}
    .n{font:700 12px system-ui,sans-serif;fill:#fff;text-anchor:middle}
    .row{fill:#fff;fill-opacity:.09}
  </style>
  <!-- what the floor wanted you to know -->
  <clipPath id="c"><rect x="200" y="20" width="120" height="96"/></clipPath>
  <g clip-path="url(#c)"><g class="letter"><rect x="222" y="56" width="76" height="56" rx="4"/><path d="M232 70h48M232 82h36M232 94h42" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/></g></g>
  <path class="env" d="M206 80h108v54H206Z"/>
  <path class="flap" d="M206 80l54 32 54-32"/>
  <circle class="badge" cx="314" cy="80" r="12" filter="url(#g)"/><text class="n" x="314" y="84">3</text>
  <g transform="translate(36 44)">
    <rect class="row" width="126" height="22" rx="7"/><rect class="row" y="32" width="126" height="22" rx="7"/><rect class="row" y="64" width="126" height="22" rx="7"/>
    <circle cx="12" cy="11" r="4" fill="#f97316"/><circle cx="12" cy="43" r="4" fill="#ec4899"/><circle cx="12" cy="75" r="4" fill="#94a3b8"/>
    <path d="M24 11h82M24 43h62M24 75h72" stroke="#fff" stroke-opacity=".38" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
