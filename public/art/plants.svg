  <path class="pin c" filter="url(#g)" d="M262 104c-9-10-14-17-14-24a14 14 0 0 1 28 0c0 7-5 14-14 24Zm0-19a5 5 0 1 0 0-10 5 5 0 0 0 0 10Z"/>
</svg>
