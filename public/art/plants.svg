<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 160" fill="none">
  <defs>
    <linearGradient id="a" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#10b981"/><stop offset="1" stop-color="#06b6d4"/></linearGradient>
    <filter id="g" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="2.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>
    .map{stroke:#fff;stroke-opacity:.12}
    .land{fill:#fff;fill-opacity:.06;stroke:#fff;stroke-opacity:.3;stroke-width:1.4}
    .pin{fill:url(#a);animation:d 3s cubic-bezier(.3,1.4,.5,1) infinite}
    .pin.b{animation-delay:.5s}.pin.c{animation-delay:1s}
    @keyframes d{0%{transform:translateY(-30px);opacity:0}20%{transform:translateY(0);opacity:1}85%{opacity:1}100%{opacity:0}}
    .ring{stroke:#10b981;stroke-width:1.6;transform-box:fill-box;transform-origin:center;animation:r 3s ease-out infinite}
    .ring.b{animation-delay:.5s}.ring.c{animation-delay:1s}
    @keyframes r{0%,18%{transform:scale(.3);opacity:0}25%{opacity:1}70%,100%{transform:scale(1.6);opacity:0}}
  </style>
  <!-- sites on the map -->
