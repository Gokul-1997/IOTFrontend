<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 160" fill="none">
  <defs>
    <linearGradient id="c" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fde047"/><stop offset="1" stop-color="#eab308"/></linearGradient>
    <filter id="g" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>
    .coin{fill:url(#c);stroke:#a16207;stroke-width:1.2}
    .top{animation:d 3s ease-in-out infinite}
    @keyframes d{0%,30%{transform:translateY(-40px);opacity:0}55%{transform:translateY(0);opacity:1}100%{opacity:1}}
    .r{font:700 17px system-ui,sans-serif;fill:#713f12;text-anchor:middle}
    .dial{stroke:#fff;stroke-opacity:.45;stroke-width:1.8}
    .needle{stroke:#22c55e;stroke-width:3;stroke-linecap:round;transform-origin:268px 100px;animation:n 3s ease-in-out infinite alternate}
    @keyframes n{from{transform:rotate(-60deg)}to{transform:rotate(38deg)}}
    .zone{stroke-width:8;stroke-linecap:round}
  </style>
  <!-- the price of a unit, and the limit it must stay under -->
  <g transform="translate(96 0)">
    <ellipse class="coin" cx="0" cy="124" rx="34" ry="10"/><rect x="-34" y="112" width="68" height="12" fill="url(#c)"/><ellipse class="coin" cx="0" cy="112" rx="34" ry="10"/>
    <rect x="-34" y="100" width="68" height="12" fill="url(#c)"/><ellipse class="coin" cx="0" cy="100" rx="34" ry="10"/>
    <g class="top"><rect x="-34" y="76" width="68" height="12" fill="url(#c)"/><ellipse class="coin" cx="0" cy="88" rx="34" ry="10"/><ellipse class="coin" cx="0" cy="76" rx="34" ry="10"/><text class="r" x="0" y="82">₹</text></g>
  </g>
  <path class="dial" d="M214 100a54 54 0 0 1 108 0"/>
  <path class="zone" d="M218 86a54 54 0 0 1 22-30" stroke="#22c55e"/>
  <path class="zone" d="M296 56a54 54 0 0 1 22 30" stroke="#ef4444"/>
  <path class="needle" d="M268 100V58" filter="url(#g)"/>
  <circle cx="268" cy="100" r="6" fill="#fff"/>
  <path d="M234 128h68" stroke="#fff" stroke-opacity=".3" stroke-width="3" stroke-linecap="round"/>
</svg>
