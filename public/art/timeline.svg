<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 160" fill="none">
  <defs>
    <linearGradient id="a" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#06b6d4"/></linearGradient>
  </defs>
  <style>
    .lane{fill:#fff;fill-opacity:.07}
    .bar{fill:url(#a);animation:s 4s ease-in-out infinite alternate}
    .bar.b{animation-delay:-1.2s}.bar.c{animation-delay:-2.4s}.bar.d{animation-delay:-.6s}
    @keyframes s{from{transform:translateX(-10px)}to{transform:translateX(16px)}}
    .now{stroke:#fff;stroke-width:1.6;stroke-dasharray:3 4;animation:n 6s linear infinite}
    @keyframes n{from{transform:translateX(0)}to{transform:translateX(220px)}}
    .lbl{font:600 10px ui-monospace,Menlo,monospace;fill:#fff;fill-opacity:.55}
  </style>
  <!-- which machine runs which shift, day by day -->
  <text class="lbl" x="36" y="47">VMC-1</text><text class="lbl" x="36" y="75">VMC-2</text><text class="lbl" x="36" y="103">HMC-7</text><text class="lbl" x="36" y="131">TC-2</text>
  <rect class="lane" x="90" y="36" width="240" height="16" rx="5"/><rect class="lane" x="90" y="64" width="240" height="16" rx="5"/>
  <rect class="lane" x="90" y="92" width="240" height="16" rx="5"/><rect class="lane" x="90" y="120" width="240" height="16" rx="5"/>
  <rect class="bar" x="110" y="36" width="90" height="16" rx="5"/><rect class="bar b" x="200" y="64" width="110" height="16" rx="5"/>
  <rect class="bar c" x="96" y="92" width="130" height="16" rx="5"/><rect class="bar d" x="170" y="120" width="80" height="16" rx="5"/>
  <path class="now" d="M100 26v118"/>
</svg>
