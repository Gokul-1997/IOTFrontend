<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 160" fill="none">
  <defs>
    <linearGradient id="a" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ec4899"/><stop offset="1" stop-color="#f97316"/></linearGradient>
    <filter id="g" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>
    .badge{fill:#fff;fill-opacity:.08;stroke:#fff;stroke-opacity:.45;stroke-width:1.5}
    .front{animation:s 3.2s ease-in-out infinite;transform-origin:250px 18px}
    @keyframes s{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
    .back1{transform:rotate(-14deg);transform-origin:250px 18px}.back2{transform:rotate(12deg);transform-origin:250px 18px}
    .head{fill:url(#a)}
    .line{stroke:#fff;stroke-opacity:.45;stroke-width:3;stroke-linecap:round}
  </style>
  <!-- the people on the floor, each with a badge -->
  <path d="M250 4v14" stroke="#fff" stroke-opacity=".4" stroke-width="2"/>
  <g class="back1"><rect class="badge" x="218" y="18" width="64" height="88" rx="10"/></g>
  <g class="back2"><rect class="badge" x="218" y="18" width="64" height="88" rx="10"/></g>
  <g class="front" filter="url(#g)">
    <rect x="216" y="18" width="68" height="94" rx="10" fill="#141b26" stroke="url(#a)" stroke-width="2"/>
    <rect x="240" y="22" width="20" height="5" rx="2.5" fill="#fff" fill-opacity=".4"/>
    <circle class="head" cx="250" cy="52" r="14"/>
    <path class="line" d="M232 80h36M238 92h24"/>
  </g>
  <g transform="translate(40 46)">
    <circle cx="10" cy="10" r="10" fill="#ec4899" fill-opacity=".7"/><path class="line" d="M28 10h70"/>
    <circle cx="10" cy="42" r="10" fill="#f97316" fill-opacity=".7"/><path class="line" d="M28 42h52"/>
  </g>
</svg>
