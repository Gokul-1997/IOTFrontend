<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 160" fill="none">
  <defs>
    <linearGradient id="a" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f43f5e"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
    <filter id="g" x="-40%" y="-80%" width="180%" height="260%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>
    .node{fill:#141b26;stroke:#fff;stroke-opacity:.5;stroke-width:1.6}
    .p{stroke:#f43f5e;stroke-opacity:.9}.m{stroke:#8b5cf6;stroke-opacity:.9}
    .link{stroke:url(#a);stroke-width:2.4;stroke-linecap:round;stroke-dasharray:180;stroke-dashoffset:180;animation:l 4s ease-in-out infinite}
    .link.b{animation-delay:.5s}.link.c{animation-delay:1s}
    @keyframes l{0%,10%{stroke-dashoffset:180}45%,85%{stroke-dashoffset:0}100%{stroke-dashoffset:-180}}
    .icon{stroke:#fff;stroke-opacity:.7;stroke-width:1.5}
  </style>
  <!-- operators joined to machines and shifts -->
  <path class="link" filter="url(#g)" d="M112 46C170 46 190 80 250 80"/>
  <path class="link b" filter="url(#g)" d="M112 80C170 80 190 40 250 40"/>
  <path class="link c" filter="url(#g)" d="M112 114C170 114 190 120 250 120"/>
  <g><circle class="node p" cx="100" cy="46" r="13"/><circle class="node p" cx="100" cy="80" r="13"/><circle class="node p" cx="100" cy="114" r="13"/></g>
  <g class="icon"><circle cx="100" cy="43" r="4"/><path d="M93 53a7 5 0 0 1 14 0"/><circle cx="100" cy="77" r="4"/><path d="M93 87a7 5 0 0 1 14 0"/><circle cx="100" cy="111" r="4"/><path d="M93 121a7 5 0 0 1 14 0"/></g>
  <g><rect class="node m" x="250" y="28" width="30" height="24" rx="6"/><rect class="node m" x="250" y="68" width="30" height="24" rx="6"/><rect class="node m" x="250" y="108" width="30" height="24" rx="6"/></g>
  <g class="icon"><rect x="258" y="34" width="14" height="12" rx="2"/><rect x="258" y="74" width="14" height="12" rx="2"/><rect x="258" y="114" width="14" height="12" rx="2"/></g>
</svg>
