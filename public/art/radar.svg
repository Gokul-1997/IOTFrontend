<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 160" fill="none">
  <defs>
    <linearGradient id="w" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ef4444" stop-opacity="0"/><stop offset="1" stop-color="#ef4444" stop-opacity=".55"/></linearGradient>
    <filter id="g" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>
    .ring{stroke:#fff;stroke-opacity:.2;stroke-width:1.3}
    .sweep{transform-origin:250px 80px;animation:s 3.2s linear infinite}
    @keyframes s{to{transform:rotate(360deg)}}
    .blip{fill:#f97316;transform-box:fill-box;transform-origin:center;animation:b 3.2s ease-out infinite}
    .blip.b{animation-delay:1.1s;fill:#ef4444}.blip.c{animation-delay:2.1s}
    @keyframes b{0%,8%{transform:scale(.2);fill-opacity:0}14%{transform:scale(1.5);fill-opacity:1}60%{fill-opacity:.35;transform:scale(1)}100%{fill-opacity:0}}
    .row{fill:#fff;fill-opacity:.1}
    .sev{animation:v 1.2s steps(2,jump-none) infinite}
    @keyframes v{50%{fill-opacity:.25}}
  </style>
  <!-- alarms found as they happen -->
  <circle class="ring" cx="250" cy="80" r="64"/><circle class="ring" cx="250" cy="80" r="44"/><circle class="ring" cx="250" cy="80" r="22"/>
  <path class="ring" d="M186 80h128M250 16v128"/>
  <g class="sweep"><path d="M250 80L314 80A64 64 0 0 0 295 35Z" fill="url(#w)"/><path d="M250 80h64" stroke="#ef4444" stroke-width="2" filter="url(#g)"/></g>
  <circle class="blip" cx="286" cy="56" r="5" filter="url(#g)"/>
  <circle class="blip b" cx="218" cy="108" r="5" filter="url(#g)"/>
  <circle class="blip c" cx="272" cy="118" r="4" filter="url(#g)"/>
  <circle cx="250" cy="80" r="4" fill="#fff"/>
  <g transform="translate(34 34)">
    <rect class="row" width="120" height="22" rx="6"/><rect class="row" y="32" width="120" height="22" rx="6"/><rect class="row" y="64" width="120" height="22" rx="6"/>
    <rect class="sev" x="8" y="7" width="8" height="8" rx="2" fill="#ef4444"/><rect x="8" y="39" width="8" height="8" rx="2" fill="#f97316"/><rect x="8" y="71" width="8" height="8" rx="2" fill="#f5b301"/>
    <path d="M26 11h74M26 43h58M26 75h66" stroke="#fff" stroke-opacity=".38" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
