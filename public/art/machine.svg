<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 160" fill="none">
  <defs>
    <filter id="g" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>
    .orbit{stroke:#fff;stroke-opacity:.18;stroke-width:1.3;stroke-dasharray:4 7;transform-box:fill-box;transform-origin:center;animation:o 18s linear infinite}
    @keyframes o{to{transform:rotate(360deg)}}
    .ax{stroke-width:3;stroke-linecap:round}
    .x{stroke:#13c4b1}.y{stroke:#2f7bff}.z{stroke:#ffffff}
    .t{font:700 13px ui-monospace,Menlo,monospace;fill:#fff;fill-opacity:.85}
    .cube{stroke:#fff;stroke-opacity:.35;stroke-width:1.4;animation:c 6s ease-in-out infinite}
    @keyframes c{50%{stroke-opacity:.12}}
    .scan{fill:url(#s);animation:s 3.2s ease-in-out infinite}
    @keyframes s{0%,100%{transform:translateY(0)}50%{transform:translateY(64px)}}
    .dot{fill:#13c4b1;animation:d 1.2s steps(2,jump-none) infinite}
    @keyframes d{50%{fill-opacity:.2}}
  </style>
  <linearGradient id="s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#13c4b1" stop-opacity="0"/><stop offset=".5" stop-color="#13c4b1" stop-opacity=".45"/><stop offset="1" stop-color="#13c4b1" stop-opacity="0"/></linearGradient>
  <!-- the twin: a wire cube, scanned, inside the machine's axes -->
  <ellipse class="orbit" cx="190" cy="84" rx="110" ry="40"/>
  <path class="cube" d="M160 56l34-18 34 18v40l-34 18-34-18Z M160 56l34 18 34-18 M194 74v40"/>
  <rect class="scan" x="156" y="34" width="76" height="14"/>
  <g filter="url(#g)">
    <path class="ax x" d="M194 96l62 30"/><path class="ax y" d="M194 96l-58 30"/><path class="ax z" d="M194 96V28"/>
  </g>
  <text class="t" x="262" y="136">X</text><text class="t" x="120" y="136">Y</text><text class="t" x="199" y="24">Z</text>
  <circle class="dot" cx="194" cy="96" r="5"/>
  <g transform="translate(40 34)">
    <rect x="0" y="0" width="70" height="44" rx="8" stroke="#fff" stroke-opacity=".22" stroke-width="1.3"/>
    <text x="10" y="18" class="t" style="font-size:9px;fill-opacity:.6">SPINDLE</text>
    <text x="10" y="35" class="t" style="font-size:15px;fill:#13c4b1">LIVE</text>
  </g>
</svg>
