<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 160" fill="none">
  <defs>
    <linearGradient id="a" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14b8a6"/><stop offset="1" stop-color="#10b981"/></linearGradient>
    <filter id="g" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2.8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>
    .gear{stroke:#fff;stroke-opacity:.5;stroke-width:1.8;transform-origin:250px 84px;animation:s 8s linear infinite}
    .gear.b{transform-origin:304px 56px;animation-direction:reverse;animation-duration:5s}
    @keyframes s{to{transform:rotate(360deg)}}
    .wrench{fill:url(#a);transform-origin:190px 110px;animation:w 2.8s ease-in-out infinite}
    @keyframes w{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(14deg)}}
    .card{fill:#fff;fill-opacity:.08;stroke:#fff;stroke-opacity:.3}
  </style>
  <!-- tickets opened, worked on and closed -->
  <path class="gear" d="M250 48l7 1 3-8 8 3-1 8 6 5 8-3 3 8-7 4 1 8-1 8 7 4-3 8-8-3-6 5 1 8-8 3-3-8-7 1-7-1-3 8-8-3 1-8-6-5-8 3-3-8 7-4-1-8 1-8-7-4 3-8 8 3 6-5-1-8 8-3 3 8Z"/>
  <circle cx="250" cy="84" r="12" stroke="#fff" stroke-opacity=".5" stroke-width="1.8"/>
  <path class="gear b" d="M304 36l4 1 2-5 5 2-1 5 4 3 5-2 2 5-5 3 1 4-1 4 5 3-2 5-5-2-4 3 1 5-5 2-2-5-4 1-4-1-2 5-5-2 1-5-4-3-5 2-2-5 5-3-1-4 1-4-5-3 2-5 5 2 4-3-1-5 5-2 2 5Z"/>
  <path class="wrench" filter="url(#g)" d="M122 62a22 22 0 0 0 28 26l40 40a8 8 0 0 0 11-11l-40-40a22 22 0 0 0-26-28l13 13-4 11-11 4Z"/>
  <rect class="card" x="40" y="118" width="120" height="22" rx="7"/>
  <circle cx="54" cy="129" r="5" fill="#10b981"/><path d="M66 129h78" stroke="#fff" stroke-opacity=".38" stroke-width="3" stroke-linecap="round"/>
</svg>
