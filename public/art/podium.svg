<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 160" fill="none">
  <defs>
    <linearGradient id="a" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ec4899"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
    <filter id="g" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2.8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>
    .step{fill:#fff;fill-opacity:.1;stroke:#fff;stroke-opacity:.35;stroke-width:1.4}
    .first{fill:url(#a);fill-opacity:.85;stroke:none}
    .head{stroke:#fff;stroke-width:2;animation:b 2.4s ease-in-out infinite}
    .head.b{animation-delay:.4s}.head.c{animation-delay:.8s}
    @keyframes b{50%{transform:translateY(-6px)}}
    .star{fill:#f5b301;transform-box:fill-box;transform-origin:center;animation:s 3s ease-in-out infinite}
    @keyframes s{0%,100%{transform:rotate(0) scale(1)}50%{transform:rotate(20deg) scale(1.2)}}
    .n{font:700 16px system-ui,sans-serif;fill:#fff}
  </style>
  <!-- the people who ran the floor, ranked -->
  <rect class="step" x="150" y="96" width="56" height="46" rx="6"/>
  <rect class="step first" x="208" y="72" width="56" height="70" rx="6"/>
  <rect class="step" x="266" y="108" width="56" height="34" rx="6"/>
  <text class="n" x="173" y="126">2</text><text class="n" x="231" y="112">1</text><text class="n" x="289" y="132">3</text>
  <g class="head b"><circle cx="178" cy="72" r="12"/><path d="M162 94a16 12 0 0 1 32 0"/></g>
  <g class="head"><circle cx="236" cy="46" r="13" stroke="#ec4899"/><path d="M219 70a17 12 0 0 1 34 0" stroke="#ec4899"/></g>
  <g class="head c"><circle cx="294" cy="84" r="11"/><path d="M280 104a14 10 0 0 1 28 0"/></g>
  <path class="star" filter="url(#g)" d="M236 14l3.5 7 7.7 1.1-5.6 5.4 1.3 7.7-6.9-3.6-6.9 3.6 1.3-7.7-5.6-5.4 7.7-1.1Z"/>
  <g transform="translate(34 44)" stroke="#fff" stroke-opacity=".4" stroke-width="2.2" stroke-linecap="round">
    <path d="M0 0h86"/><path d="M0 22h64"/><path d="M0 44h96"/><path d="M0 66h52"/>
  </g>
  <g transform="translate(34 40)" fill="#ec4899"><circle cx="100" cy="4" r="4"/><circle cx="78" cy="26" r="4" fill="#8b5cf6"/><circle cx="110" cy="48" r="4"/></g>
</svg>
