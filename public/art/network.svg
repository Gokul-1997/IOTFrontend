<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 160" fill="none">
  <defs>
    <linearGradient id="a" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6a4dff"/><stop offset="1" stop-color="#ec4899"/></linearGradient>
    <filter id="g" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="2.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>
    .edge{stroke:#fff;stroke-opacity:.2;stroke-width:1.4}
    .node{fill:#141b26;stroke:#fff;stroke-opacity:.55;stroke-width:1.6}
    .hub{fill:url(#a)}
    .pulse{fill:#fff}
    .ring{stroke:#6a4dff;transform-box:fill-box;transform-origin:center;animation:r 2.6s ease-out infinite}
    @keyframes r{from{transform:scale(.6);opacity:1}to{transform:scale(1.9);opacity:0}}
  </style>
  <!-- the company, its roles and its people, joined -->
  <path class="edge" d="M250 80L190 40M250 80L190 120M250 80L318 44M250 80L318 116M250 80L160 80M190 40L120 30M190 120L120 132"/>
  <circle class="ring" cx="250" cy="80" r="20"/>
  <circle class="hub" cx="250" cy="80" r="18" filter="url(#g)"/>
  <path d="M242 84l6-10 6 10M244 80h8" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  <g><circle class="node" cx="190" cy="40" r="9"/><circle class="node" cx="190" cy="120" r="9"/><circle class="node" cx="318" cy="44" r="9"/><circle class="node" cx="318" cy="116" r="9"/><circle class="node" cx="160" cy="80" r="9"/><circle class="node" cx="120" cy="30" r="7"/><circle class="node" cx="120" cy="132" r="7"/></g>
  <circle class="pulse" r="3" filter="url(#g)"><animateMotion dur="2.4s" repeatCount="indefinite" path="M250 80L190 40L120 30"/></circle>
  <circle class="pulse" r="3" filter="url(#g)"><animateMotion dur="2.8s" repeatCount="indefinite" path="M250 80L318 116"/></circle>
  <circle class="pulse" r="3" filter="url(#g)"><animateMotion dur="3.2s" repeatCount="indefinite" path="M250 80L190 120L120 132"/></circle>
</svg>
