<div class="operators-page">

  <div class="p-6 bg-gray-100 dark:bg-[#0b1628] min-h-screen">

    <div class="flex justify-between items-center mb-4">
      <h2 class="text-xl font-semibold">Operators</h2>

      <button mat-raised-button color="primary" (click)="openCreate()">
        <mat-icon>add</mat-icon>
        Add Operator
      </button>
    </div>

    <mat-form-field appearance="outline" class="w-72 mb-4">
      <mat-label>Search operators</mat-label>
      <input matInput (keyup)="applyFilter($event)" placeholder="Search....." />
      <mat-icon matSuffix>search</mat-icon>
    </mat-form-field>

    <!-- TABLE CARD -->
    <div class="table-card mat-elevation-z2">

      <table mat-table [dataSource]="dataSource" matSort class="full-width">

        <!-- Code -->
        <ng-container matColumnDef="operator_code">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Code</th>
          <td mat-cell *matCellDef="let row" class="code">
            {{ row.operator_code }}
          </td>
        </ng-container>

        <!-- Name -->
        <ng-container matColumnDef="operator_name">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Name</th>
          <td mat-cell *matCellDef="let row">
            {{ row.operator_name }}
          </td>
        </ng-container>

        <!-- Shift -->
        <ng-container matColumnDef="shift">
          <th mat-header-cell *matHeaderCellDef>Shift</th>
          <td mat-cell *matCellDef="let row">
            <div class="shift-name">{{ row.shift_name }}</div>
            <div class="sub-text">
              {{ row.start_time }} – {{ row.end_time }}
            </div>
          </td>
        </ng-container>

        <!-- Machines -->
        <ng-container matColumnDef="machines">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Machines</th>
          <td mat-cell *matCellDef="let row">
            <span class="machine-badge">
              {{ row.machine_count || row.machines?.length || 0 }}
            </span>
          </td>
        </ng-container>

        <!-- Status -->
        <ng-container matColumnDef="is_active">
          <th mat-header-cell *matHeaderCellDef>Status</th>
          <td mat-cell *matCellDef="let row">
            <mat-slide-toggle color="primary" [checked]="row.is_active" (change)="toggle(row)">
            </mat-slide-toggle>
          </td>
        </ng-container>

        <!-- Actions -->
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef></th>
          <td mat-cell *matCellDef="let row" class="actions">
            <button mat-icon-button>
              <mat-icon>edit</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      </table>

      <mat-paginator [pageSize]="10" [pageSizeOptions]="[5,10,20,50]" showFirstLastButtons>
      </mat-paginator>

    </div>
  </div>
