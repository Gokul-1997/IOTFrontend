<div class="operators-page">

  <div class="p-4 mx-auto max-w-screen-2xl md:p-6">


    <!-- Title Section -->
    <div class="flex flex-col gap-4 mb-6 sm:flex-row sm:items-center sm:justify-between">
      <div>
        <h2 class="text-xl font-semibold text-gray-800 dark:text-white/90"> Operators </h2>
      </div>
      <div class="flex items-center gap-3">
        <div class="flex items-center gap-4 rounded-full bg-white px-4 py-2 shadow-sm 
         dark:bg-gray-800">
          <!-- Date & Time -->
          <div class="flex items-center gap-2 text-sm text-gray-700 dark:text-gray-300">
            <span
              class="flex h-6 w-6 items-center justify-center rounded-full bg-blue-100 text-blue-600 dark:bg-blue-900/40 dark:text-blue-400">
              🕒
            </span>
            <span>20 Jan 2026 | 3:45 PM</span>
          </div>
        </div>

        <!-- 🔍 Search -->

        <div class="relative">
          <input type="text" (ngModelChange)="applyFilter($event)" placeholder="Shift code / name" class="w-full rounded-full border border-gray-300 bg-white px-4 py-2.5 pr-10 
                    text-sm text-gray-700 shadow-sm 
                    focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 
                    transition duration-200" />

          <!-- Search Icon -->
          <svg class="absolute right-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400" fill="none" stroke="currentColor"
            stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M21 21l-4.35-4.35m1.85-5.65a7 7 0 11-14 0 7 7 0 0114 0z" />
          </svg>
        </div>



        <div class="flex items-center gap-4 rounded-full ">
          <!-- Machine Running -->
          <button (click)="openCreate()" class="inline-flex items-center gap-2 
                rounded-full bg-blue-600 px-5 py-2.5 
                text-sm font-medium text-white 
                shadow-md transition 
                hover:bg-blue-700 
                focus:outline-none focus:ring-2 focus:ring-blue-500">

            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
            </svg>

            Add Operator
          </button>

        </div>
      </div>
    </div>



    <!-- TABLE CARD -->
    <div class="table-card mat-elevation-z2">

      <table mat-table [dataSource]="dataSource" matSort class="full-width">

        <!-- Code -->
        <ng-container matColumnDef="operator_code">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Code</th>
          <td mat-cell *matCellDef="let row" class="code">
            {{ row.operator_code }}
          </td>
        </ng-container>

        <!-- Name -->
        <ng-container matColumnDef="operator_name">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Name</th>
          <td mat-cell *matCellDef="let row">
            {{ row.operator_name }}
          </td>
        </ng-container>

        <!-- Shift -->
        <ng-container matColumnDef="shift">
          <th mat-header-cell *matHeaderCellDef>Shift</th>
          <td mat-cell *matCellDef="let row">
            <div class="shift-name">{{ row.shift_name }}</div>
            <div class="sub-text">
              {{ row.start_time }} – {{ row.end_time }}
            </div>
          </td>
        </ng-container>

        <!-- Machines -->
        <ng-container matColumnDef="machines">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Machines</th>
          <td mat-cell *matCellDef="let row">
            <span class="machine-badge">
              {{ row.machine_count || row.machines?.length || 0 }}
            </span>
          </td>
        </ng-container>


        <!-- Actions -->
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef></th>
          <td mat-cell *matCellDef="let row" class="actions">
            <button mat-icon-button (click)="openEdit(row)">
              <mat-icon>edit</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      </table>

      <mat-paginator [pageSize]="10" [pageSizeOptions]="[5,10,20,50]" showFirstLastButtons>
      </mat-paginator>

    </div>
  </div>
