<h2>Hourly OEE</h2>

<div class="filters">
  <select [(ngModel)]="machineId">
    <option value="">Select Machine</option>
    <option *ngFor="let m of machines" [value]="m.id">
      {{ m.machine_name }}
    </option>
  </select>

  <input type="date" [(ngModel)]="date" />

  <button (click)="load()">Load</button>
</div>

<canvas id="oeeChart"></canvas>
