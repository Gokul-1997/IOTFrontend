<div class="p-4 md:p-6 max-w-3xl mx-auto">
  <div class="flex items-start justify-between gap-3 mb-1">
    <h1 class="text-2xl font-bold text-gray-800 dark:text-white">Notifications</h1>
    <button (click)="markAllRead()" [disabled]="loading || !notifications.length"
      class="text-sm font-medium text-blue-600 dark:text-blue-400 hover:underline disabled:opacity-40 disabled:no-underline">
      Mark all read
    </button>
  </div>
  <p class="text-sm text-gray-500 dark:text-gray-400 mb-4">Everything sent to your account.</p>

  <!-- unread filter -->
  <div class="inline-flex rounded-lg border border-gray-200 dark:border-gray-700 p-0.5 mb-4" role="tablist" aria-label="Filter">
    <button role="tab" [attr.aria-selected]="!unreadOnly" (click)="setUnreadOnly(false)"
      class="px-3 py-1.5 text-sm rounded-md transition-colors"
      [class.bg-blue-600]="!unreadOnly" [class.text-white]="!unreadOnly"
      [class.text-gray-600]="unreadOnly" [class.dark:text-gray-300]="unreadOnly">
      All
    </button>
    <button role="tab" [attr.aria-selected]="unreadOnly" (click)="setUnreadOnly(true)"
      class="px-3 py-1.5 text-sm rounded-md transition-colors"
      [class.bg-blue-600]="unreadOnly" [class.text-white]="unreadOnly"
      [class.text-gray-600]="!unreadOnly" [class.dark:text-gray-300]="!unreadOnly">
      Unread
    </button>
  </div>

  <!-- ── loading ── -->
  <div *ngIf="loading" class="space-y-2" aria-busy="true" role="status" aria-label="Loading notifications">
    <div class="h-16 bg-gray-100 dark:bg-gray-800 rounded-xl animate-pulse" *ngFor="let i of [0,1,2,3,4]"></div>
  </div>

  <!-- ── error ── -->
  <div *ngIf="!loading && errorMsg" class="bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-800 rounded-xl p-4" role="alert">
    <p class="text-sm text-red-700 dark:text-red-300">{{ errorMsg }}</p>
    <button (click)="load()" class="mt-2 text-sm font-medium text-red-700 dark:text-red-300 underline">Try again</button>
  </div>

  <!-- ── empty ── -->
  <div *ngIf="!loading && !errorMsg && !notifications.length"
    class="bg-white dark:bg-gray-800 rounded-xl border border-gray-200 dark:border-gray-700 p-10 text-center">
    <p class="text-sm text-gray-500 dark:text-gray-400">
      {{ unreadOnly ? 'No unread notifications.' : 'Nothing here yet.' }}
    </p>
  </div>

  <!-- ── list ── -->
  <ul *ngIf="!loading && !errorMsg && notifications.length"
    class="bg-white dark:bg-gray-800 rounded-xl border border-gray-200 dark:border-gray-700 divide-y divide-gray-100 dark:divide-gray-700 overflow-hidden">
    <li *ngFor="let n of notifications">
      <button type="button" (click)="open(n)"
        class="w-full flex items-start gap-3 p-4 text-left transition-colors hover:bg-gray-50 dark:hover:bg-gray-700/50"
        [class.bg-blue-50]="!n.is_read" [class.dark:bg-blue-900]="!n.is_read" [class.dark:bg-opacity-10]="!n.is_read">
        <span class="mt-1.5 h-2 w-2 rounded-full flex-none" [ngClass]="dotClass(n.type)" aria-hidden="true"></span>
        <span class="min-w-0 flex-1">
          <span class="flex items-baseline justify-between gap-2">
            <span class="text-sm font-medium text-gray-800 dark:text-white truncate">{{ n.title }}</span>
            <span class="text-xs text-gray-400 dark:text-gray-500 flex-none">{{ n.created_at | date:'short' }}</span>
          </span>
          <span class="block text-sm text-gray-500 dark:text-gray-400 mt-0.5">{{ n.message }}</span>
        </span>
        <span *ngIf="!n.is_read" class="sr-only">Unread</span>
      </button>
    </li>
  </ul>

  <!-- ── pager ── -->
  <div *ngIf="!loading && !errorMsg && total > limit" class="flex items-center justify-between mt-4 text-sm text-gray-500 dark:text-gray-400">
    <span aria-live="polite">Page {{ page }} of {{ totalPages }} · {{ total }} total</span>
    <span class="inline-flex gap-2">
      <button (click)="changePage(-1)" [disabled]="page <= 1"
        class="px-3 py-1.5 rounded-lg border border-gray-200 dark:border-gray-700 disabled:opacity-40">‹ Previous</button>
      <button (click)="changePage(1)" [disabled]="page >= totalPages"
        class="px-3 py-1.5 rounded-lg border border-gray-200 dark:border-gray-700 disabled:opacity-40">Next ›</button>
    </span>
  </div>
</div>
