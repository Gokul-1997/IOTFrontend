<div class="mexa-titlebar">
  <div class="flex gap-2 items-center">
    <h1 class="mexa-title">Notifications</h1>
    <p class="mexa-subtitle">( Everything sent to your account )</p>
  </div>
  <span class="mexa-titlebar-spacer"></span>
  <button type="button" class="ui-btn ui-btn-ghost" (click)="markAllRead()" [disabled]="loading || !notifications.length">
    Mark all read
  </button>
</div>

<div class="ui-tabs ui-tabs-center" role="tablist" aria-label="Filter">

  <button type="button"
          role="tab"
          class="ui-tab"
          [class.is-active]="!unreadOnly"
          [attr.aria-selected]="!unreadOnly"
          [attr.tabindex]="!unreadOnly ? 0 : -1"
          (click)="setUnreadOnly(false)">
    All
  </button>

  <button type="button"
          role="tab"
          class="ui-tab"
          [class.is-active]="unreadOnly"
          [attr.aria-selected]="unreadOnly"
          [attr.tabindex]="unreadOnly ? 0 : -1"
          (click)="setUnreadOnly(true)">
    Unread
  </button>

</div>

<div class="mexa-card mexa-card-flush">
  <!-- loading -->
  <div *ngIf="loading" class="mexa-empty" aria-busy="true" role="status">
    <span class="ui-spinner" aria-hidden="true"></span> Loading notifications…
  </div>

  <!-- error -->
  <div *ngIf="!loading && errorMsg" class="nt-pad" role="alert">
    <div class="ui-alert ui-alert-error">{{ errorMsg }}</div>
    <button type="button" (click)="load()" class="ui-btn ui-btn-ghost ui-btn-sm nt-retry">Try again</button>
  </div>

  <!-- empty -->
  <p *ngIf="!loading && !errorMsg && !notifications.length" class="mexa-empty">
    {{ unreadOnly ? 'No unread notifications.' : 'Nothing here yet.' }}
  </p>

  <!-- list -->
  <ul *ngIf="!loading && !errorMsg && notifications.length" class="nt-list">
    <li *ngFor="let n of notifications">
      <button type="button" (click)="open(n)" class="nt-item" [class.is-unread]="!n.is_read">
        <span class="nt-dot" [ngClass]="dotClass(n.type)" aria-hidden="true"></span>
        <span class="nt-body">
          <span class="nt-head">
            <span class="nt-title">{{ n.title }}</span>
            <span class="nt-time">{{ n.created_at | date:'d MMM y, h:mm a' }}</span>
          </span>
          <span class="nt-msg">{{ n.message }}</span>
        </span>
        <span *ngIf="!n.is_read" class="sr-only">Unread</span>
      </button>
    </li>
  </ul>

  <!-- pager -->
  <div *ngIf="!loading && !errorMsg && total > limit" class="mexa-tablebar">
    <span class="mexa-drill" aria-live="polite">Page <strong>{{ page }}</strong> of {{ totalPages }} · {{ total }} total</span>
    <div class="mexa-pager">
      <button type="button" class="mexa-pagebtn" (click)="changePage(-1)" [disabled]="page <= 1">‹ Previous</button>
      <button type="button" class="mexa-pagebtn" (click)="changePage(1)" [disabled]="page >= totalPages">Next ›</button>
    </div>
  </div>
</div>
