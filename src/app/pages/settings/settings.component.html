<div class="p-4 md:p-6 max-w-2xl mx-auto">
  <h1 class="text-2xl font-bold text-gray-800 dark:text-white mb-1">Settings</h1>
  <p class="text-sm text-gray-500 dark:text-gray-400 mb-6">Appearance and notifications</p>

  <!-- ══════════ APPEARANCE ══════════ -->
  <section class="bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700 p-6 mb-6">
    <h2 class="font-semibold text-gray-800 dark:text-white mb-4">Appearance</h2>

    <div class="flex items-center justify-between gap-4">
      <div>
        <p class="text-sm font-medium text-gray-700 dark:text-gray-200">Dark mode</p>
        <p class="text-xs text-gray-400 dark:text-gray-500">Applies everywhere and is remembered next time you sign in.</p>
      </div>
      <button type="button" role="switch" [attr.aria-checked]="theme.isDark()"
        (click)="theme.toggle()"
        class="relative inline-flex h-6 w-11 flex-none items-center rounded-full transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500"
        [class.bg-blue-600]="theme.isDark()" [class.bg-gray-300]="!theme.isDark()">
        <span class="sr-only">Toggle dark mode</span>
        <span class="inline-block h-4 w-4 transform rounded-full bg-white transition-transform"
          [class.translate-x-6]="theme.isDark()" [class.translate-x-1]="!theme.isDark()"></span>
      </button>
    </div>
  </section>

  <!-- ══════════ NOTIFICATIONS ══════════ -->
  <section class="bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700 p-6">
    <div class="flex items-start justify-between gap-3 mb-1">
      <h2 class="font-semibold text-gray-800 dark:text-white">Notifications</h2>
      <span *ngIf="saving" class="text-xs text-gray-400 dark:text-gray-500">Saving…</span>
      <span *ngIf="saveNote && !saving" class="text-xs text-emerald-600 dark:text-emerald-400" role="status">{{ saveNote }}</span>
    </div>
    <p class="text-sm text-gray-500 dark:text-gray-400 mb-4">Choose which notifications reach you.</p>

    <div *ngIf="loading" class="space-y-3" aria-busy="true" role="status" aria-label="Loading preferences">
      <div class="h-10 bg-gray-100 dark:bg-gray-700 rounded-lg animate-pulse" *ngFor="let i of [0,1,2,3,4]"></div>
    </div>

    <p *ngIf="!loading && errorMsg" class="text-sm text-red-600 dark:text-red-400" role="alert">
      {{ errorMsg }} <button (click)="load()" class="underline">Try again</button>
    </p>

    <div *ngIf="!loading && !errorMsg" class="divide-y divide-gray-100 dark:divide-gray-700">
      <div *ngFor="let row of rows" class="flex items-center justify-between gap-4 py-3">
        <div class="min-w-0">
          <p class="text-sm font-medium text-gray-700 dark:text-gray-200">{{ row.label }}</p>
          <p class="text-xs text-gray-400 dark:text-gray-500">{{ row.hint }}</p>
        </div>
        <button type="button" role="switch" [attr.aria-checked]="!!prefs[row.key]"
          [attr.aria-label]="row.label"
          (click)="toggle(row.key)"
          class="relative inline-flex h-6 w-11 flex-none items-center rounded-full transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500"
          [class.bg-blue-600]="prefs[row.key]" [class.bg-gray-300]="!prefs[row.key]">
          <span class="inline-block h-4 w-4 transform rounded-full bg-white transition-transform"
            [class.translate-x-6]="prefs[row.key]" [class.translate-x-1]="!prefs[row.key]"></span>
        </button>
      </div>
    </div>

    <p *ngIf="saveErr" class="mt-3 text-sm text-red-600 dark:text-red-400" role="alert">{{ saveErr }}</p>
  </section>
</div>
