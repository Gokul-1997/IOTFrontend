<div class="mexa-titlebar">
  <h1 class="mexa-title">Settings</h1>
</div>

<div class="set-grid">
  <section class="mexa-card" aria-labelledby="set-appearance">
    <h2 id="set-appearance" class="mexa-card-title mexa-card-title-left">Appearance</h2>
    <div class="mexa-setting">
      <div class="set-content">
        <span class="material-icons set-icon" aria-hidden="true">{{ theme.isDark() ? 'dark_mode' : 'light_mode' }}</span>
        <div class="set-text">
          <p class="mexa-setting-label" id="set-dark">Dark mode</p>
          <p class="mexa-setting-hint" id="set-dark-hint">Use a dark display. Saved on this device.</p>
        </div>
      </div>
      <button type="button" role="switch" class="mexa-switch" aria-labelledby="set-dark"
        aria-describedby="set-dark-hint" [attr.aria-checked]="theme.isDark()" (click)="theme.toggle()"></button>
    </div>
  </section>

  <app-alarm-notification-settings *ngIf="alarmNotifications"></app-alarm-notification-settings>

  <section *ngIf="companyAdmin" class="mexa-card" aria-labelledby="set-admin">
    <h2 id="set-admin" class="mexa-card-title mexa-card-title-left">Administration</h2>
    <a routerLink="/admin/users" class="mexa-setting set-link">
      <span class="material-icons set-icon" aria-hidden="true">groups</span>
      <span class="set-text">
        <span class="mexa-setting-label block">Users</span>
        <span class="mexa-setting-hint block">Manage company users and their roles.</span>
      </span>
      <span class="material-icons set-chevron" aria-hidden="true">chevron_right</span>
    </a>
    <a routerLink="/admin/roles" class="mexa-setting set-link">
      <span class="material-icons set-icon" aria-hidden="true">admin_panel_settings</span>
      <span class="set-text">
        <span class="mexa-setting-label block">Roles &amp; Permissions</span>
        <span class="mexa-setting-hint block">Choose what each role can access.</span>
      </span>
      <span class="material-icons set-chevron" aria-hidden="true">chevron_right</span>
    </a>
  </section>
</div>
