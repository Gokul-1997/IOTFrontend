<div class="p-4 mx-auto max-w-screen-2xl md:p-6">
  <!-- Title Section -->
  <div class="flex flex-col gap-4 mb-6 sm:flex-row sm:items-center sm:justify-between">
    <div>
      <h2 class="text-xl font-semibold text-gray-800 dark:text-white/90"> Machines </h2>
    </div>
    <div class="flex items-center gap-3">
      <div class="flex items-center gap-4 rounded-full bg-white px-4 py-2 shadow-sm 
         dark:bg-gray-800">
        <!-- Date & Time -->
        <div class="flex items-center gap-2 text-sm text-gray-700 dark:text-gray-300">
          <span
            class="flex h-6 w-6 items-center justify-center rounded-full bg-blue-100 text-blue-600 dark:bg-blue-900/40 dark:text-blue-400">
            🕒
          </span>
          <span>20 Jan 2026 | 3:45 PM</span>
        </div>
      </div>
      <div class="flex items-center gap-4 rounded-full ">
        <div class="relative">
          <input type="text" [(ngModel)]="search" (ngModelChange)="onSearch()" placeholder="Search..." class="w-full rounded-full border border-gray-300 bg-white px-4 py-2.5 pr-10 
             text-sm text-gray-700 shadow-sm 
             focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 
             transition duration-200" />

          <!-- Search Icon -->
          <svg class="absolute right-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400" fill="none" stroke="currentColor"
            stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M21 21l-4.35-4.35m1.85-5.65a7 7 0 11-14 0 7 7 0 0114 0z" />
          </svg>
        </div>
      </div>
      <div class="flex items-center gap-4 rounded-full ">
        <!-- Machine Running -->
        <button mat-raised-button (click)="openCreate()"
          class="!bg-blue-600 !text-white hover:!bg-blue-700 !shadow-md rounded-lg px-5 py-2">
          <mat-icon class="mr-2">add</mat-icon>
          New Machine
        </button>
      </div>
    </div>
  </div>



  <!-- 📊 Table -->
  <div class="mat-elevation-z2 rounded-lg overflow-hidden bg-white dark:bg-[#0f1c33]">

    <table mat-table [dataSource]="rows" matSort (matSortChange)="onSort($event)">

      <!-- Name -->
      <ng-container matColumnDef="machine_name">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Machine Name</th>
        <td mat-cell *matCellDef="let r">{{ r.machine_name }}</td>
      </ng-container>

      <!-- Type -->
      <ng-container matColumnDef="axis_model">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Machine Axis Model</th>
        <td mat-cell *matCellDef="let r">{{ r.axis_model }}</td>
      </ng-container>

      <!-- controller_model -->
      <ng-container matColumnDef="controller_model">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Controller Model</th>
        <td mat-cell *matCellDef="let r">{{ r.controller_model }}</td>
      </ng-container>

      <!-- controller_model -->
      <ng-container matColumnDef="machine_year">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Machine Year</th>
        <td mat-cell *matCellDef="let r">{{ r.machine_year }}</td>
      </ng-container>

      <!-- line -->
      <ng-container matColumnDef="line_name">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Line</th>
        <td mat-cell *matCellDef="let r">{{ r.line_name }}</td>
      </ng-container>


      <!-- Status -->
      <ng-container matColumnDef="is_active">
        <th mat-header-cell *matHeaderCellDef>Status</th>
        <td mat-cell *matCellDef="let r">
          <mat-slide-toggle color="primary" [checked]="r.is_active" (change)="toggle(r)">
          </mat-slide-toggle>
        </td>
      </ng-container>

      <!-- Actions -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Action</th>
        <td mat-cell *matCellDef="let r">
          <button mat-icon-button color="primary" (click)="openEdit(r)">
            <mat-icon>edit</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>

    <!-- ❌ No Data -->
    <div *ngIf="rows.length === 0" class="p-6 text-center text-gray-400">
      No machines found
    </div>

    <!-- 📄 Pagination -->
    <mat-paginator [length]="total" [pageSize]="limit" [pageSizeOptions]="[5, 10, 20]" (page)="onPage($event)">
    </mat-paginator>

  </div>

  <app-machine-form *ngIf="showForm" [data]="editData" (close)="showForm=false" (saved)="onSaved()">
  </app-machine-form>

</div>
