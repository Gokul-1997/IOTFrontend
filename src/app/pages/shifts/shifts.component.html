<div class="p-4 mx-auto max-w-screen-2xl md:p-6">



  <!-- Title Section -->
<div class="flex flex-col gap-4 mb-6 sm:flex-row sm:items-center sm:justify-between">
   <div>
      <h2 class="text-xl font-semibold text-gray-800 dark:text-white/90"> Shifts </h2>
   </div>
   <div class="flex items-center gap-3">
      <div class="flex items-center gap-4 rounded-full bg-white px-4 py-2 shadow-sm 
         dark:bg-gray-800">
         <!-- Date & Time -->
         <div class="flex items-center gap-2 text-sm text-gray-700 dark:text-gray-300">
            <span class="flex h-6 w-6 items-center justify-center rounded-full bg-blue-100 text-blue-600 dark:bg-blue-900/40 dark:text-blue-400">
            🕒
            </span>
            <span>20 Jan 2026 | 3:45 PM</span>
         </div>
      </div>
      
          <!-- 🔍 Search -->

        <div class="relative">
            <input
              type="text"
              [(ngModel)]="search"
              (ngModelChange)="applyFilter()"
              placeholder="Shift code / name"
              class="w-full rounded-full border border-gray-300 bg-white px-4 py-2.5 pr-10 
                    text-sm text-gray-700 shadow-sm 
                    focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 
                    transition duration-200"
            />

            <!-- Search Icon -->
            <svg
              class="absolute right-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M21 21l-4.35-4.35m1.85-5.65a7 7 0 11-14 0 7 7 0 0114 0z" />
            </svg>
          </div>



      <div class="flex items-center gap-4 rounded-full ">
         <!-- Machine Running -->
        <button
          (click)="openCreate()"
          class="inline-flex items-center gap-2 
                rounded-full bg-blue-600 px-5 py-2.5 
                text-sm font-medium text-white 
                shadow-md transition 
                hover:bg-blue-700 
                focus:outline-none focus:ring-2 focus:ring-blue-500">
          
          <svg class="w-4 h-4" fill="none" stroke="currentColor"
              stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M12 4v16m8-8H4"/>
          </svg>

          New Shift
        </button>

      </div>
   </div>
</div>

  

  <!-- 📋 Table -->
  <div class="mat-elevation-z2 rounded-lg bg-white dark:bg-[#0f1c33]">

    <table mat-table [dataSource]="filteredRows" matSort>

      <!-- Shift Code -->
      <ng-container matColumnDef="shift_code">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Code</th>
        <td mat-cell *matCellDef="let r">{{ r.shift_code }}</td>
      </ng-container>

      <!-- Shift Name -->
      <ng-container matColumnDef="shift_name">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Name</th>
        <td mat-cell *matCellDef="let r">{{ r.shift_name }}</td>
      </ng-container>

      <!-- Time -->
      <ng-container matColumnDef="time">
        <th mat-header-cell *matHeaderCellDef>Time</th>
        <td mat-cell *matCellDef="let r">
          {{ r.start_time }} – {{ r.end_time }}
        </td>
      </ng-container>

      <!-- Break -->
      <ng-container matColumnDef="break_minutes">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Break (min)</th>
        <td mat-cell *matCellDef="let r">{{ r.break_minutes }}</td>
      </ng-container>

      <!-- Status -->
      <ng-container matColumnDef="is_active">
        <th mat-header-cell *matHeaderCellDef>Status</th>
        <td mat-cell *matCellDef="let r">
          <mat-slide-toggle
            color="primary"
            [checked]="r.is_active"
            (change)="toggle(r)">
          </mat-slide-toggle>
        </td>
      </ng-container>

      <!-- Action -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Action</th>
        <td mat-cell *matCellDef="let r">
          <button mat-icon-button color="primary" (click)="openEdit(r)">
            <mat-icon>edit</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>

    <div *ngIf="filteredRows.length === 0"
         class="p-6 text-center text-gray-400">
      No shifts found
    </div>

  </div>

</div>
