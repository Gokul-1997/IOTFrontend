<h2 mat-dialog-title>
  {{ data ? 'Edit Shift' : 'Create Shift' }}
</h2>

<form [formGroup]="form" (ngSubmit)="submit()">

  <mat-dialog-content class="dialog-body">

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Shift Code</mat-label>
      <input matInput formControlName="shift_code" placeholder="e.g. SHIFT-A">
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Shift Name</mat-label>
      <input matInput formControlName="shift_name" placeholder="Morning Shift">
    </mat-form-field>

    <div class="time-row">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Start Time</mat-label>
        <input matInput type="time" formControlName="start_time" (click)="openTimePicker($event)">
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>End Time</mat-label>
        <input matInput type="time" formControlName="end_time" (click)="openTimePicker($event)">
      </mat-form-field>

      <div *ngIf="form.errors?.['invalidDuration']" class="error-text">
        Invalid shift duration.
      </div>

      <div *ngIf="form.errors?.['invalidBreak']" class="error-text">
        Break cannot be greater than shift duration.
      </div>


    </div>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Break (Minutes)</mat-label>
      <input matInput type="number" min="0" formControlName="break_minutes">
    </mat-form-field>

  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="cancel()">Cancel</button>
    <button mat-flat-button color="primary" type="submit" [disabled]="saving">
      {{ saving ? 'Saving…' : 'Save' }}
    </button>
  </mat-dialog-actions>

</form>
