<h2>Shifts</h2>

<table>
  <tr>
    <th>Code</th>
    <th>Name</th>
    <th>Start</th>
    <th>End</th>
    <th>Break (min)</th>
  </tr>

  <tr *ngFor="let s of shifts">
    <td>{{ s.shift_code }}</td>
    <td>{{ s.shift_name }}</td>
    <td>{{ s.start_time }}</td>
    <td>{{ s.end_time }}</td>
    <td>{{ s.break_minutes }}</td>
  </tr>
</table>

<a routerLink="/shifts/create">+ Create Shift</a>
