<!-- The Reports page's filter bar (reports.html): the same grid, labels,
     fields and Reset on every tab — machine, not line, as on every page.
     The filters apply themselves, as on the dashboards; the Reports toolbar
     exports this tab. -->
<div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-3 items-end mb-4" appAutoApply (autoApply)="applyFilters()">

  <div class="flex flex-col gap-1">
    <label class="label_custom" for="orFrom">Date From</label>
    <input type="date" id="orFrom" name="orFrom" appReportDate [rdBefore]="toDate" [(ngModel)]="fromDate" class="filter-date" />
  </div>

  <div class="flex flex-col gap-1">
    <label class="label_custom" for="orTo">Date To</label>
    <input type="date" id="orTo" name="orTo" appReportDate [rdAfter]="fromDate" [(ngModel)]="toDate" class="filter-date" />
  </div>

  <div class="flex flex-col gap-1">
    <label class="label_custom" for="orMachine">Machine</label>
    <select id="orMachine" name="orMachine" [(ngModel)]="selectedMachine" [disabled]="loadingMeta" class="filter-select">
      <option [ngValue]="null">All Machines</option>
      <option *ngFor="let m of machines" [ngValue]="m.id">{{ m.machine_serial_no }}</option>
    </select>
  </div>

  <div class="flex flex-col gap-1">
    <label class="label_custom" for="orShift">Shift</label>
    <select id="orShift" name="orShift" [(ngModel)]="selectedShift" [disabled]="loadingMeta" class="filter-select">
      <option [ngValue]="null">All Shifts</option>
      <option *ngFor="let s of shifts" [ngValue]="s.id">{{ s.shift_code }}</option>
    </select>
  </div>

  <!-- Reset: today, every machine and shift -->
  <div class="flex gap-2">
    <button type="button" (click)="reset()"
      class="btn-clear flex-1 min-w-0 inline-flex items-center justify-center gap-1">
      <span class="material-icons text-[18px]" aria-hidden="true">restart_alt</span> Reset
    </button>
  </div>
</div>

<p *ngIf="error" class="mexa-note mexa-note-bad" role="alert">{{ error }}</p>

<div class="mexa-tablewrap" tabindex="0" role="region" aria-label="OEE records table — scroll sideways to see every column">
  <div class="table-wrap">
    <table class="mexa-table is-dense is-striped">
      <caption class="sr-only">OEE records by machine and shift</caption>
      <thead>
        <tr>
          <th scope="col" class="col-index">#</th>
          <th *ngFor="let c of columns" scope="col" [ngClass]="c.cls || ''" [attr.aria-sort]="c.sort ? ariaSort(c.sort) : null">
            <button *ngIf="c.sort as key; else plainHead" type="button" class="mexa-sort"
                    (click)="changeSort(key)" [attr.aria-current]="sortBy === key">
              {{ c.label }}
              <span class="mexa-sort-arrow" aria-hidden="true">{{ sortIcon(key) }}</span>
            </button>
            <ng-template #plainHead>{{ c.label }}</ng-template>
          </th>
        </tr>
      </thead>
      <tbody *ngIf="loading" appSkeletonRows [cols]="columns.length + 1" label="Loading the OEE records…"></tbody>
      <tbody *ngIf="!loading">
        <tr *ngFor="let row of rows; let i = index">
          <td class="col-index num muted">{{ (page - 1) * limit + i + 1 }}</td>
          <td *ngFor="let c of columns" [ngClass]="c.cls || ''"><span [ngClass]="tone(c, row)">{{ cell(c, row) }}</span></td>
        </tr>
        <tr *ngIf="!rows.length">
          <td [attr.colspan]="columns.length + 1" class="mexa-empty">No OEE records for these filters. Choose another date range, machine or shift.</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<!-- The same footer as every table; the API pages it -->
<app-mexa-pager [page]="page" [totalPages]="totalPages" [total]="total" [shown]="rows.length"
                [limit]="limit" [sizes]="sizes"
                (pageChange)="changePage($event)" (limitChange)="changeLimit($event)"></app-mexa-pager>
