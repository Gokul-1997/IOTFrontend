<div class="fixed inset-0 bg-black/40 flex items-center justify-center z-50">

  <div class="bg-white dark:bg-[#0f1c33] w-[640px] rounded-xl shadow-xl max-h-[90vh] overflow-auto">

    <!-- Header -->
    <div class="flex items-center justify-between px-6 py-4 border-b border-gray-200 dark:border-gray-700">
      <h3 class="text-lg font-semibold">Start Job</h3>
      <button (click)="cancel()" class="text-gray-500 hover:text-red-500 text-xl">
        ✕
      </button>
    </div>

    <!-- Body -->
    <div class="p-6 space-y-5">

      <!-- Row 1 (2 columns) -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">

        <!-- Machine -->
        <div class="flex flex-col gap-1">
          <label class="text-sm font-medium">Machine</label>
          <select
            [(ngModel)]="form.machine_id"
            class="w-full px-4 py-2 rounded-lg bg-gray-100 dark:bg-[#12203a] border border-gray-300 dark:border-gray-600 focus:ring-2 focus:ring-blue-500">
            <option value="">Select Machine</option>
            <option *ngFor="let m of machines" [ngValue]="m.id">
              {{ m.machine_serial_no }}
            </option>
          </select>
        </div>

        <!-- Component -->
        <div class="flex flex-col gap-1">
          <label class="text-sm font-medium">Component</label>
          <select
            [(ngModel)]="form.component_id"
            class="w-full px-4 py-2 rounded-lg bg-gray-100 dark:bg-[#12203a] border border-gray-300 dark:border-gray-600 focus:ring-2 focus:ring-blue-500">
            <option value="">Select Component</option>
            <option *ngFor="let c of components" [ngValue]="c.id">
              {{ c.part_name }}
            </option>
          </select>
        </div>

      </div>

      <!-- Row 2 (3 columns) -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">

        <!-- Job Start -->
        <div class="flex flex-col gap-1">
          <label class="text-sm font-medium">Job Start</label>
          <input
            type="datetime-local"
            [(ngModel)]="form.job_start"
            class="w-full px-3 py-2 rounded-lg bg-gray-100 dark:bg-[#12203a] border border-gray-300 dark:border-gray-600 focus:ring-2 focus:ring-blue-500" />
        </div>

        <!-- Setting Time Start -->
        <div class="flex flex-col gap-1">
          <label class="text-sm font-medium">Setting Time Start</label>
          <input
            type="datetime-local"
            [(ngModel)]="form.setting_time_start"
            class="w-full px-3 py-2 rounded-lg bg-gray-100 dark:bg-[#12203a] border border-gray-300 dark:border-gray-600 focus:ring-2 focus:ring-blue-500" />
        </div>

        <!-- Setting Time End -->
        <div class="flex flex-col gap-1">
          <label class="text-sm font-medium">Setting Time End</label>
          <input
            type="datetime-local"
            [(ngModel)]="form.setting_time_end"
            class="w-full px-3 py-2 rounded-lg bg-gray-100 dark:bg-[#12203a] border border-gray-300 dark:border-gray-600 focus:ring-2 focus:ring-blue-500" />
        </div>

      </div>

      <!-- Footer -->
      <div class="flex justify-end gap-3 pt-4 border-t border-gray-200 dark:border-gray-700">
        <button
          type="button"
          (click)="cancel()"
          class="px-4 py-2 rounded-lg bg-gray-200 dark:bg-gray-600 hover:bg-gray-300">
          Cancel
        </button>

        <button
          type="button"
          (click)="save()"
          class="px-5 py-2 rounded-lg bg-blue-600 text-white hover:bg-blue-700">
          Start Job
        </button>
      </div>

    </div>
  </div>
</div>
