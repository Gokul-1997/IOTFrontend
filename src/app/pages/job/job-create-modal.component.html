<div class="fixed inset-0 bg-black/40 flex items-center justify-center z-50">
  <div class="bg-white dark:bg-[#0f1c33] w-[420px] rounded-xl p-6 max-h-[90vh] overflow-auto">

    <h3 class="text-lg font-semibold mb-4">Start Job</h3>

    <!-- Machine -->
    <div class="mb-3">
      <label class="block text-sm mb-1 font-medium">Machine</label>
      <select
        class="w-full px-4 py-2 rounded bg-gray-100 dark:bg-[#12203a] border"
        [(ngModel)]="form.machine_id">
        <option value="">Select Machine</option>
        <option *ngFor="let m of machines" [ngValue]="m.id">{{ m.machine_serial_no }}</option>
      </select>
    </div>

    <!-- Component -->
    <div class="mb-3">
      <label class="block text-sm mb-1 font-medium">Component</label>
      <select
        class="w-full px-4 py-2 rounded bg-gray-100 dark:bg-[#12203a] border"
        [(ngModel)]="form.component_id">
        <option value="">Select Component</option>
        <option *ngFor="let c of components" [ngValue]="c.id">{{ c.part_name }}</option>
      </select>
    </div>

    <!-- Job Start -->
    <div class="mb-3">
      <label class="block text-sm mb-1 font-medium">Job Start</label>
      <input
        type="datetime-local"
        class="w-full px-4 py-2 rounded bg-gray-100 dark:bg-[#12203a] border"
        [(ngModel)]="form.job_start" />
    </div>

    <!-- Setting Time Start -->
    <div class="mb-3">
      <label class="block text-sm mb-1 font-medium">Setting Time Start</label>
      <input
        type="datetime-local"
        class="w-full px-4 py-2 rounded bg-gray-100 dark:bg-[#12203a] border"
        [(ngModel)]="form.setting_time_start" />
    </div>

    <!-- Setting Time End -->
    <div class="mb-4">
      <label class="block text-sm mb-1 font-medium">Setting Time End</label>
      <input
        type="datetime-local"
        class="w-full px-4 py-2 rounded bg-gray-100 dark:bg-[#12203a] border"
        [(ngModel)]="form.setting_time_end" />
    </div>

    <!-- Buttons -->
    <div class="flex justify-end gap-3">
      <button type="button" (click)="cancel()" class="px-4 py-2 bg-gray-300 rounded">
        Cancel
      </button>
      <button type="button" (click)="save()" class="px-4 py-2 bg-blue-600 text-white rounded">
        Start Job
      </button>
    </div>

  </div>
</div>
