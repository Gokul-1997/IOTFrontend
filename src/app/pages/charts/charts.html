<div class="body-pad">
   <!-- HEADER -->
   <!-- Title Section -->
   <div class="flex flex-col gap-4 mb-3 sm:flex-row sm:items-center sm:justify-between bg-gradient-to-l from-[#C5404A] via-[#5E3C79] to-[#4A2FA0] rounded-lg ps-3 py-1 pe-1">
   <div>
      <h2 class="text-xl font-ubuntu font-bold text-white dark:text-white/90"> Charts </h2>
   </div>
   <div class="flex items-center gap-3">
      
     <div class="w-full">
  <div class="flex flex-wrap items-end gap-4">

    <!-- Machine Name -->
    <div class="flex gap-2 items-center">
      <label class="text-sm font-medium text-white mb-1">
        Machine Name
      </label>

      <select
        class="bg-gray-100 border border-gray-200 text-gray-800 text-sm rounded-lg px-4 py-2.5 min-w-[160px] focus:outline-none focus:ring-2 focus:ring-indigo-500">

        <option>CNC136</option>
        <option>CNC137</option>
        <option>CNC138</option>

      </select>
    </div>


    <!-- Shift -->
    <div class="flex gap-2 items-center">
      <label class="text-sm font-medium text-white mb-1">
        Shift
      </label>

      <select
        class="bg-gray-100 border border-gray-200 text-gray-800 text-sm rounded-lg px-4 py-2.5 min-w-[100px] focus:outline-none focus:ring-2 focus:ring-indigo-500">

        <option>01</option>
        <option>02</option>
        <option>03</option>

      </select>
    </div>



    <!-- Date Range -->
    <div class="flex gap-2 items-center">
      <label class="text-sm font-medium text-white mb-1">
        Date Range
      </label>

      <div class="relative">

        <input
          type="text"
          placeholder="30/01/2026 - 28/02/2026"
          class="bg-gray-100 border border-gray-200 text-gray-800 text-sm rounded-lg px-4 py-2.5 pr-10 min-w-[240px] focus:outline-none focus:ring-2 focus:ring-indigo-500"
        />

        <!-- Calendar Icon -->
        <svg
          class="w-5 h-5 absolute right-3 top-1/2 -translate-y-1/2 text-gray-500"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          viewBox="0 0 24 24">

          <rect x="3" y="4" width="18" height="18" rx="2"/>
          <line x1="16" y1="2" x2="16" y2="6"/>
          <line x1="8" y1="2" x2="8" y2="6"/>
          <line x1="3" y1="10" x2="21" y2="10"/>

        </svg>

      </div>
    </div>



    <!-- Submit Button -->
    <button
      class="flex items-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium px-5 py-2.5 rounded-lg">

      Submit

      <!-- Check Icon -->
      <svg
        class="w-4 h-4"
        fill="none"
        stroke="currentColor"
        stroke-width="3"
        viewBox="0 0 24 24">

        <path d="M5 13l4 4L19 7"/>

      </svg>

    </button>


  </div>
</div>
   </div>
</div>
<!-- Body Section -->
<div class="space-y-6">
   <!-- Machine Status Card -->
   <div class="rounded-2xl border border-gray-200 dark:border-gray-700
              bg-gray-100 dark:bg-gray-800
              p-4 md:p-6">
              <div class="flex justify-between">
               <p class="font-medium mb-2">Machine Status</p>
               <p>Total Part Produced Today: <span class="font-semibold">20</span></p>
              </div>
              <apx-chart
                  [series]="machineStatusChart.series"
                  [chart]="machineStatusChart.chart"
                  [plotOptions]="machineStatusChart.plotOptions"
                  [xaxis]="machineStatusChart.xaxis"
                  [yaxis]="machineStatusChart.yaxis"
                  [legend]="machineStatusChart.legend"
                  [fill]="machineStatusChart.fill"
                  [dataLabels]="machineStatusChart.dataLabels"
                  [tooltip]="machineStatusChart.tooltip"
                  [colors]="machineStatusChart.colors"
                  ></apx-chart>
   </div>
   <div class="grid grid-cols-1 xl:grid-cols-12 gap-6 items-center">
      <!-- Downtime Card -->
      <div class="col-span-6 rounded-2xl border border-gray-200 dark:border-gray-700
              bg-gray-100 dark:bg-gray-800
              p-4 md:p-6">
            <div class="flex justify-between">
               <p class="font-medium mb-2">Down Time</p>
               <div class="flex gap-2">
                  <p>Planned: <span class="font-semibold text-[var(--blue)]">55M</span></p>
                  <p>Unplanned: <span class="font-semibold text-[var(--red)]">35M</span></p>
               </div>
              </div>
            </div>

            <!-- Part Count Card -->
              <div class="col-span-6 rounded-2xl border border-gray-200 dark:border-gray-700
              bg-gray-100 dark:bg-gray-800
              p-4 md:p-6">
            <div class="flex justify-between">
               <p class="font-medium mb-2">Hour Wise Part Count</p>
               <p>Total Part Produced Today: <span class="font-semibold">20</span></p>
              </div>
              <apx-chart
  [series]="partCountChart.series"
  [chart]="partCountChart.chart"
  [colors]="partCountChart.colors"
  [dataLabels]="partCountChart.dataLabels"
  [stroke]="partCountChart.stroke"
  [grid]="partCountChart.grid"
  [markers]="partCountChart.markers"
  [xaxis]="partCountChart.xaxis"
  [yaxis]="partCountChart.yaxis"
  [legend]="partCountChart.legend"
  [tooltip]="partCountChart.tooltip">
</apx-chart>
            </div>
   </div>
</div>
</div>
