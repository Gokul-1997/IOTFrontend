<div class="min-h-screen flex stm-auth-field items-center justify-center px-4 py-10">

  <div class="w-full max-w-md bg-white dark:bg-neutral-900 rounded-2xl p-8 stm-auth-card">

    <img src="/images/logo/STM_Mexa_logo.svg" alt="STM Mexa" class="mb-8" />

    <h1 class="text-2xl font-semibold text-gray-800 dark:text-white mb-2">
      Reset Password
    </h1>

    <p class="text-gray-500 dark:text-gray-400 mb-6">
      Enter your new password below.
    </p>

    <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-5">

      <!-- New Password -->
      <div>
        <label class="text-sm text-gray-600 dark:text-gray-300">New Password</label>

        <div class="relative">
          <input
            [type]="showPassword ? 'text' : 'password'"
            formControlName="password"
            placeholder="Enter new password"
            class="w-full mt-1 px-4 py-3 pr-12 rounded-lg border
                   border-gray-300 dark:border-neutral-700
                   bg-white dark:bg-neutral-800
                   text-gray-800 dark:text-white
                   focus:ring-2 focus:ring-indigo-500 outline-none"
            [class.border-red-500]="form.get('password')?.invalid && form.get('password')?.touched" />

          <button type="button" (click)="showPassword = !showPassword"
            class="absolute inset-y-0 right-0 flex items-center px-3 text-gray-400 hover:text-gray-600 dark:hover:text-white transition" [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'" [attr.aria-pressed]="showPassword">
            <span class="material-icons text-[20px]" aria-hidden="true">{{ showPassword ? 'visibility_off' : 'visibility' }}</span>
          </button>
        </div>

        <div *ngIf="form.get('password')?.touched && form.get('password')?.invalid" class="mt-1 text-xs text-red-500">
          <span *ngIf="form.get('password')?.errors?.['required']">Password is required.</span>
          <span *ngIf="form.get('password')?.errors?.['minlength']">Password must be at least 8 characters.</span>
        </div>
      </div>

      <!-- Confirm Password -->
      <div>
        <label class="text-sm text-gray-600 dark:text-gray-300">Confirm Password</label>

        <div class="relative">
          <input
            [type]="showConfirm ? 'text' : 'password'"
            formControlName="confirm_password"
            placeholder="Confirm your password"
            class="w-full mt-1 px-4 py-3 pr-12 rounded-lg border
                   border-gray-300 dark:border-neutral-700
                   bg-white dark:bg-neutral-800
                   text-gray-800 dark:text-white
                   focus:ring-2 focus:ring-indigo-500 outline-none"
            [class.border-red-500]="(form.get('confirm_password')?.touched && form.get('confirm_password')?.invalid) || (form.errors?.['passwordMismatch'] && form.get('confirm_password')?.touched)" />

          <button type="button" (click)="showConfirm = !showConfirm"
            class="absolute inset-y-0 right-0 flex items-center px-3 text-gray-400 hover:text-gray-600 dark:hover:text-white transition" [attr.aria-label]="showConfirm ? 'Hide password' : 'Show password'" [attr.aria-pressed]="showConfirm">
            <span class="material-icons text-[20px]" aria-hidden="true">{{ showConfirm ? 'visibility_off' : 'visibility' }}</span>
          </button>
        </div>

        <div *ngIf="form.get('confirm_password')?.touched" class="mt-1 text-xs text-red-500">
          <span *ngIf="form.get('confirm_password')?.errors?.['required']">Confirm password is required.</span>
          <span *ngIf="!form.get('confirm_password')?.errors?.['required'] && form.errors?.['passwordMismatch']">Passwords do not match.</span>
        </div>
      </div>

      <!-- Submit -->
      <button type="submit"
        class="w-full btn-primary justify-center">
        Reset Password
      </button>

    </form>

    <!-- Success -->
    <p *ngIf="success" class="text-green-600 text-sm mt-4">
      {{ message }}
    </p>

    <!-- Error -->
    <p *ngIf="!success && message" class="text-red-500 text-sm mt-4">
      {{ message }}
    </p>

    <div class="text-center mt-6">
      <a routerLink="/login" class="text-[#2b3990] dark:text-[#9fb3ff] hover:underline text-sm">
        ← Back to Login
      </a>
    </div>

  </div>

</div>
