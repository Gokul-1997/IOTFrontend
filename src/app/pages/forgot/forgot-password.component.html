<div class="min-h-screen flex items-center justify-center bg-gray-100 dark:bg-neutral-900">

  <!-- Dark Mode Toggle -->
  <button (click)="toggleDark()"
    class="absolute top-6 right-6 w-10 h-10 flex items-center justify-center
           rounded-lg bg-white dark:bg-neutral-800 border border-gray-200 dark:border-neutral-700
           shadow-sm hover:scale-105 transition">

    <!-- Sun -->
    <svg *ngIf="isDark" xmlns="http://www.w3.org/2000/svg"
      class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
        d="M12 3v2.25M21 12h-2.25M12 18.75V21M5.25 12H3"/>
    </svg>

    <!-- Moon -->
    <svg *ngIf="!isDark" class="w-5 h-5 text-gray-700 dark:text-gray-200"
      fill="currentColor" viewBox="0 0 24 24">
      <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>
    </svg>
  </button>

  <!-- CARD -->
  <div class="w-full max-w-md px-6">
    <div class="bg-white dark:bg-neutral-800 rounded-2xl shadow-xl p-8">

      <!-- Logo -->
      <div class="text-center mb-6">
        <h1 class="text-2xl font-bold text-[#2f4ac4] tracking-wide">
          YOUR APP
        </h1>
      </div>

      <!-- Title -->
      <h2 class="text-xl font-semibold text-gray-800 dark:text-white text-center mb-1">
        Forgot Password
      </h2>

      <p class="text-gray-500 dark:text-gray-400 text-center mb-6 text-sm">
        Enter your email to receive a reset link
      </p>

      <!-- FORM -->
      <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-5">

        <!-- Email -->
        <div>
          <label class="text-sm text-gray-600 dark:text-gray-300">Email</label>

          <input type="email"
            formControlName="email"
            placeholder="Enter your email"
            class="w-full mt-1 px-4 py-3 rounded-lg border
                   border-gray-300 dark:border-neutral-700
                   bg-white dark:bg-neutral-800
                   text-gray-800 dark:text-white
                   focus:ring-2 focus:ring-indigo-500 outline-none"
            [class.border-red-500]="form.get('email')?.invalid && form.get('email')?.touched" />

          <div *ngIf="form.get('email')?.touched && form.get('email')?.invalid"
            class="mt-1 text-xs text-red-500">
            <span *ngIf="form.get('email')?.errors?.['required']">Email is required.</span>
            <span *ngIf="form.get('email')?.errors?.['email']">Enter a valid email.</span>
          </div>
        </div>

        <!-- Button -->
        <button type="submit" [disabled]="loading"
          class="w-full btn-primary justify-center py-3 rounded-lg">

          {{ loading ? 'Sending...' : 'Send Reset Link' }}

        </button>

      </form>

      <!-- Success -->
      <div *ngIf="message"
        class="mt-4 text-sm text-green-700 bg-green-50 dark:bg-green-900/20 px-4 py-3 rounded-lg">
        {{ message }}
        <div class="text-xs text-gray-500 mt-1">
          Check your inbox or spam folder.
        </div>
      </div>

      <!-- Error -->
      <div *ngIf="error"
        class="mt-4 text-sm text-red-600 bg-red-50 dark:bg-red-900/20 px-4 py-3 rounded-lg">
        {{ error }}
      </div>

      <!-- Back -->
      <div class="text-center mt-6">
        <a routerLink="/login"
          class="text-[#2f4ac4] hover:underline text-sm">
          ← Back to Login
        </a>
      </div>

    </div>
  </div>
</div>
