<div class="min-h-screen flex bg-white dark:bg-[#031735]">

  <!-- Dark mode toggle -->
  <button (click)="toggleDark()" class="absolute top-6 right-6
  w-10 h-10 flex items-center justify-center
  rounded-lg
  bg-white dark:bg-neutral-800
  border border-gray-200 dark:border-neutral-700
  shadow-sm hover:scale-105 transition">

    <span class="material-icons text-[22px] text-gray-700 dark:text-gray-200" aria-hidden="true">{{ isDark ? 'light_mode' : 'dark_mode' }}</span>

  </button>


  <!-- LEFT CAROUSEL -->
  <!-- Left carousel panel: visible on desktop and larger screens -->
<div
  class="hidden lg:flex lg:w-1/2 relative min-h-screen
         flex-col items-center justify-center
         overflow-hidden px-8 xl:px-12 py-16
         bg-[#112B4E]"
>
  <!-- Background effect -->
  <div class="absolute inset-0 stm-auth-field pointer-events-none"></div>

  <!-- Carousel content -->
  <div class="relative z-10 w-full max-w-2xl mx-auto">

    <!-- Carousel viewport -->
    <div class="w-full overflow-hidden">

      <!-- Slides track -->
      <div
        class="flex items-stretch transition-transform duration-700 ease-out"
        [style.transform]="'translateX(-' + currentSlide * 100 + '%)'"
      >

        <!-- Individual slide -->
        <div
          *ngFor="let slide of slides"
          class="w-full min-w-0 flex-shrink-0
                 text-white select-none"
        >

          <!-- Illustration -->
          <div
            class="relative flex items-center justify-center
                   w-full h-64 xl:h-80 mb-8"
          >

            <!-- Soft glow -->
            <div
              class="absolute left-1/2 top-1/2
                     -translate-x-1/2 -translate-y-1/2
                     w-56 h-56 xl:w-80 xl:h-80
                     rounded-full bg-white/20
                     blur-[90px] pointer-events-none"
            ></div>

            <!-- Product image -->
            <img
              [src]="slide.image"
              [alt]="slide.title"
              class="relative z-10
                     w-full max-w-[420px]
                     max-h-full h-auto
                     object-contain mx-auto
                     pointer-events-none"
              draggable="false"
            />

          </div>

          <!-- Slide text -->
          <div class="w-full max-w-lg mx-auto px-2">

            <h1
              class="text-2xl xl:text-4xl
                     font-bold leading-tight
                     tracking-tight mb-4"
            >
              {{ slide.title }}
            </h1>

            <div
              class="w-12 h-1 bg-white
                     mb-5 rounded-full"
            ></div>

            <p
              class="text-sm xl:text-base
                     leading-7 text-white/80
                     max-w-md"
            >
              {{ slide.desc }}
            </p>

          </div>

        </div>
      </div>
    </div>
  </div>

  <!-- Carousel indicators -->
  <div
    class="absolute bottom-8 left-1/2
           -translate-x-1/2 z-20
           flex items-center justify-center gap-3"
    aria-label="Carousel navigation"
  >

    <button
      *ngFor="let slide of slides; let i = index"
      type="button"
      (click)="goToSlide(i)"
      [attr.aria-label]="'Go to slide ' + (i + 1)"
      [attr.aria-current]="currentSlide === i ? 'true' : null"
      [ngClass]="
        currentSlide === i
          ? 'w-8 bg-white'
          : 'w-2.5 bg-white/40 hover:bg-white/70'
      "
      class="h-2.5 rounded-full
             transition-all duration-300
             focus-visible:outline-none
             focus-visible:ring-2
             focus-visible:ring-white
             focus-visible:ring-offset-2
             focus-visible:ring-offset-[#112B4E]"
    ></button>

  </div>
</div>



  <!-- RIGHT FORM -->

  <div class="flex flex-1 items-center justify-center px-6">

    <div class="w-full max-w-md">


      <!-- logo -->

      <img src="/images/logo/STM_Mexa_logo.svg" alt="STM Mexa" class="mb-8" />


      <h2 class="text-2xl font-semibold
      text-gray-800 dark:text-white mb-2">

        Forgot Password

      </h2>


      <p class="text-gray-500 dark:text-gray-400 mb-6">

        Enter your email and we will send reset link

      </p>



      <!-- form -->

      <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-5">


        <div>

          <label class="text-sm text-gray-600 dark:text-gray-300">

            Email

          </label>


          <input type="email" formControlName="email" placeholder="Enter your email" class="w-full mt-1 px-4 py-3 rounded-lg border
            border-gray-300
            dark:border-[#293d5c]
            bg-white dark:bg-[#05142c]
            text-gray-800 dark:text-white
            focus:ring-2 focus:ring-indigo-500
            outline-none"
            [class.border-red-500]="form.get('email')?.invalid && form.get('email')?.touched" />

          <div *ngIf="form.get('email')?.touched && form.get('email')?.invalid" class="mt-1 text-xs text-red-500">
            <span *ngIf="form.get('email')?.errors?.['required']">Email is required.</span>
            <span *ngIf="form.get('email')?.errors?.['email']">Enter a valid email address.</span>
          </div>

        </div>



        <!-- button -->

        <button type="submit" [disabled]="loading" class="w-full btn-primary justify-center py-3 rounded-lg transition">

          {{ loading ? 'Sending...' : 'Send Reset Link' }}

        </button>


      </form>




      <!-- Success Message -->
      <p *ngIf="message" class="text-green-600 text-sm mt-4">
        {{ message }}
        <br>
        <span class="text-gray-500 text-xs">
          Please check your email inbox or spam folder.
        </span>
      </p>

      <p *ngIf="error" class="text-red-500 text-sm mt-4">
        {{ error }}
      </p>

      <!-- back -->

      <div class="text-center mt-6">

        <a routerLink="/login" class="text-[#2f4ac4] hover:underline">

          ← Back to Login

        </a>

      </div>


    </div>

  </div>

</div>
