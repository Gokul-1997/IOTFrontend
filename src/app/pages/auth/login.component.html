<div class="min-h-screen flex items-center justify-center  dark:bg-neutral-900">

  <!-- Dark Mode Toggle -->
  <button (click)="toggleDark()"
    class="absolute top-6 right-6 w-10 h-10 flex items-center justify-center
           rounded-lg bg-white dark:bg-neutral-800 border border-gray-200 dark:border-neutral-700
           shadow-sm hover:scale-105 transition">

    <!-- Sun -->
    <svg *ngIf="isDark" xmlns="http://www.w3.org/2000/svg" fill="none"
      viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-5">
      <path stroke-linecap="round" stroke-linejoin="round"
        d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591-1.591M12 18.75V21m-4.773-4.227-1.591 1.591M5.25 12H3"/>
    </svg>

    <!-- Moon -->
    <svg *ngIf="!isDark" class="w-5 h-5 text-gray-700 dark:text-gray-200"
      fill="currentColor" viewBox="0 0 24 24">
      <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>
    </svg>
  </button>

  <!-- LOGIN CARD -->
  <div class="w-full max-w-md px-6">
    <div class="bg-white dark:bg-neutral-800 rounded-2xl shadow-xl p-8">

      <!-- Dummy Logo -->
      <div class="flex justify-center">
        <img src="/images/logo/mp_logo.png" class="w-64 dark:hidden" />
      <img src="/images/logo/mp_logo.png" class="w-64 hidden dark:block" alt="Logo" />
      </div>

      <p class="text-gray-500 dark:text-gray-400 text-center mb-6 text-sm">
        Sign in to continue
      </p>

      <!-- FORM -->
      <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-5">

        <!-- Email -->
        <div>
          <label class="text-sm text-gray-600 dark:text-gray-300">Email</label>
          <input type="email" formControlName="email"
            placeholder="Enter your email"
            class="filter-select"
            [class.border-red-500]="form.get('email')?.invalid && form.get('email')?.touched" />

          <div *ngIf="form.get('email')?.touched && form.get('email')?.invalid"
            class="mt-1 text-xs text-red-500">
            <span *ngIf="form.get('email')?.errors?.['required']">Email is required.</span>
            <span *ngIf="form.get('email')?.errors?.['email']">Enter a valid email.</span>
          </div>
        </div>

        <!-- Password -->
        <div>
          <label class="text-sm text-gray-600 dark:text-gray-300">Password</label>

          <div class="relative">
            <input
              [type]="showPassword ? 'text' : 'password'"
              formControlName="password"
              placeholder="Enter your password"
              class="filter-select pr-10"
              [class.border-red-500]="form.get('password')?.invalid && form.get('password')?.touched" />

            <button type="button"
              (click)="togglePassword()"
              class="absolute inset-y-0 right-0 flex items-center px-3 text-gray-400 hover:text-gray-600 dark:hover:text-white">

              <!-- Eye -->
              <svg *ngIf="!showPassword" xmlns="http://www.w3.org/2000/svg"
                class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                  d="M2.25 12s3.75-7.5 9.75-7.5 9.75 7.5 9.75 7.5-3.75 7.5-9.75 7.5-9.75-7.5-9.75-7.5z"/>
              </svg>

              <svg *ngIf="showPassword" xmlns="http://www.w3.org/2000/svg"
                class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                  d="M3 3l18 18"/>
              </svg>

            </button>
          </div>

          <div *ngIf="form.get('password')?.touched && form.get('password')?.invalid"
            class="mt-1 text-xs text-red-500">
            <span *ngIf="form.get('password')?.errors?.['required']">Password is required.</span>
            <span *ngIf="form.get('password')?.errors?.['minlength']">Minimum 6 characters.</span>
          </div>
        </div>

        <!-- Forgot -->
        <div class="text-right">
          <a routerLink="/forgot-password"
            class="text-sm text-[#2f4ac4] hover:underline">
            Forgot Password?
          </a>
        </div>

        <!-- Error -->
        <div *ngIf="error"
          class="text-sm text-red-600 bg-red-50 dark:bg-red-900/20 px-3 py-2 rounded-lg">
          {{ error }}
        </div>

        <!-- Button -->
        <button type="submit" [disabled]="loading"
          class="btn-primary w-full justify-center">

          <span *ngIf="!loading">Sign In</span>
          <span *ngIf="loading">Signing in...</span>

        </button>

      </form>
    </div>
  </div>
</div>
