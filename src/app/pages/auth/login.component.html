<div class="min-h-screen flex bg-white dark:bg-neutral-900">
  <!-- Dark mode toggle -->
  <button type="button" (click)="toggleDark()" aria-label="Switch light or dark theme" class="absolute top-6 right-6
w-10 h-10
flex items-center justify-center
rounded-lg
bg-white dark:bg-neutral-800
border border-gray-200 dark:border-neutral-700
shadow-sm
hover:scale-105 transition">
    <span class="material-icons text-[22px] text-gray-700 dark:text-gray-200" aria-hidden="true">{{ isDark ? 'light_mode' : 'dark_mode' }}</span>
  </button>
  <!-- LEFT SIDE CAROUSEL -->
  <!-- LEFT -->
  <!-- LEFT CAROUSEL -->
  <div class="hidden lg:flex w-1/2 relative justify-center overflow-hidden pt-24 md:pt-4">
    <!-- Fixed gradient -->
    <div class="absolute inset-0 stm-auth-field"></div>
    <!-- Carousel container -->
    <div (mouseenter)="pauseCarousel()" (mouseleave)="resumeCarousel()" (touchstart)="onTouchStart($event)"
      (touchend)="onTouchEnd($event)" (mousedown)="onMouseDown($event)" (mouseup)="onMouseUp($event)">
      <!-- Slides -->
      <!-- OUTER WRAPPER  -->
      <div class="relative w-full ">
        <!-- SLIDER TRACK -->
        <div class="flex transition-transform duration-700 ease-out"
          [style.transform]="'translateX(-' + currentSlide * 100 + '%)'">
          <!-- EACH SLIDE -->
          <div *ngFor="let slide of slides" class="w-full flex-shrink-0 text-white select-none">
            <!-- IMAGE -->
            <div class="relative flex justify-center log-holder-top">
              <div
                class="absolute  bg-white rounded-full blur-[120px] opacity-40 top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2">
              </div>
              <img [src]="slide.image" alt="" class="relative mb-10 mx-auto pointer-events-none login-holder" >
            </div>
            <!-- TEXT -->
            <div class="max-w-md mx-auto px-6 md:-mt-4">
              <!-- slides are decoration beside the form: the page's heading is "Sign In" -->
              <h2 class="text-5xl md:text-3xl font-bold mb-4">
                {{slide.title}}
              </h2>
              <div class="w-12 h-1 bg-white mb-6 rounded "></div>
              <p class="text-white/80">
                {{slide.desc}}
              </p>
            </div>
          </div>
        </div>
      </div>
    </div>
    <!-- Indicators -->
    <div class="absolute md:bottom-5 bottom-32 right-20 flex gap-3">
      <div *ngFor="let slide of slides; let i=index" (click)="goToSlide(i)" class="w-3 h-3 rounded-full cursor-pointer"
        [ngClass]="currentSlide === i ? 'bg-white' : 'bg-white/40'"></div>
    </div>
  </div>
  <!-- RIGHT SIDE LOGIN -->
  <div class="flex flex-1 items-center justify-center px-6">
    <div class="w-full max-w-md">
      <!-- Logo -->
      <img src="/images/logo/STM_Mexa_logo.svg" alt="STM Mexa" class="mb-8" />
      <h1 class="text-2xl font-semibold text-gray-800 dark:text-white mb-2"> Sign In </h1>
      <p class="text-gray-500 dark:text-gray-400 mb-6"> Enter your email and password to sign in </p>
      <!-- FORM -->
      <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-5">
        <!-- Email -->
        <div>
          <label for="login-email" class="text-sm text-gray-600 dark:text-gray-300"> Email </label>
          <input id="login-email" type="email" formControlName="email" placeholder="Enter your email" class="filter-select"
                   required autocomplete="email"
                   [attr.aria-describedby]="form.get('email')?.invalid && form.get('email')?.touched ? 'login-email-error' : null"
                   [attr.aria-invalid]="form.get('email')?.invalid && form.get('email')?.touched"
                   [class.border-red-500]="form.get('email')?.invalid && form.get('email')?.touched" />
          <div id="login-email-error" *ngIf="form.get('email')?.touched && form.get('email')?.invalid" class="mt-1 text-xs text-red-500">
            <span *ngIf="form.get('email')?.errors?.['required']">Email is required.</span>
            <span *ngIf="form.get('email')?.errors?.['email']">Enter a valid email address.</span>
          </div>
        </div>
        <!-- Password -->
        <div>
          <label for="login-password" class="text-sm text-gray-600 dark:text-gray-300"> Password </label>
<div class="relative">

  <input
    id="login-password"
    [type]="showPassword ? 'text' : 'password'"
    formControlName="password"
    required autocomplete="current-password"
    [attr.aria-describedby]="form.get('password')?.invalid && form.get('password')?.touched ? 'login-password-error' : null"
    [attr.aria-invalid]="form.get('password')?.invalid && form.get('password')?.touched"
    placeholder="Enter your password"
    class="filter-select"
    [class.border-red-500]="form.get('password')?.invalid && form.get('password')?.touched" />

  <!-- Professional Eye Toggle Button -->
  <button
    type="button"
    [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'" [attr.aria-pressed]="showPassword"
    (click)="togglePassword()"
    class="absolute inset-y-0 right-0 flex items-center px-3
           text-gray-400 hover:text-gray-600
           dark:hover:text-white
           transition">

    <span class="material-icons text-[20px]" aria-hidden="true">{{ showPassword ? 'visibility_off' : 'visibility' }}</span>

  </button>

</div>
          <div id="login-password-error" *ngIf="form.get('password')?.touched && form.get('password')?.invalid" class="mt-1 text-xs text-red-500">
            <span *ngIf="form.get('password')?.errors?.['required']">Password is required.</span>
            <span *ngIf="form.get('password')?.errors?.['minlength']">Password must be at least 6 characters.</span>
          </div>
        </div>
        <!-- Forgot -->
        <div class="text-right">
          <a routerLink="/forgot-password" class="text-sm text-[#2f4ac4] hover:underline"> Forgot Password? </a>
        </div>

        <!-- API Error Banner -->
        <div *ngIf="error" role="alert"
          class="flex items-start gap-3 rounded-lg border border-red-200 bg-red-50 dark:bg-red-900/20 dark:border-red-800 px-4 py-3">
          <span class="material-icons text-[20px] text-red-600 dark:text-red-400 flex-shrink-0" aria-hidden="true">error_outline</span>
          <div class="flex-1">
            <p class="text-sm font-medium text-red-700 dark:text-red-400">{{ error }}</p>
          </div>
          <button type="button" (click)="error = ''" class="text-red-400 hover:text-red-600 transition" aria-label="Dismiss message" title="Dismiss">
            <span class="material-icons text-[18px]" aria-hidden="true">close</span>
          </button>
        </div>

        <!-- Button -->
        <button type="submit" [disabled]="loading"
          class="btn-primary text-center w-full justify-center">
          <svg *ngIf="loading" class="animate-spin w-4 h-4 text-white" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"/>
          </svg>
          {{ loading ? 'Signing in...' : 'Sign In' }}
        </button>
      </form>
    </div>
  </div>
</div>
