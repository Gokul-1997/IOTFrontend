<div class="p-4 mx-auto max-w-screen-2xl md:p-6">

  <!-- HEADER -->
<!-- Title Section -->
<div class="flex flex-col gap-4 mb-6 sm:flex-row sm:items-center sm:justify-between">
   <div>
      <h2 class="text-xl font-semibold text-gray-800 dark:text-white/90"> Plants </h2>
   </div>
   <div class="flex items-center gap-3">
      <div class="flex items-center gap-4 rounded-full bg-white px-4 py-2 shadow-sm 
         dark:bg-gray-800">
         <!-- Date & Time -->
         <div class="flex items-center gap-2 text-sm text-gray-700 dark:text-gray-300">
            <span class="flex h-6 w-6 items-center justify-center rounded-full bg-blue-100 text-blue-600 dark:bg-blue-900/40 dark:text-blue-400">
            🕒
            </span>
            <span>20 Jan 2026 | 3:45 PM</span>
         </div>
      </div>
      
          <!-- 🔍 Search -->

        <div class="relative">
            <input
              type="text"
              [(ngModel)]="search" 
              (ngModelChange)="page=1; load()"
              placeholder="Shift code / name"
              class="w-full rounded-full border border-gray-300 bg-white px-4 py-2.5 pr-10 
                    text-sm text-gray-700 shadow-sm 
                    focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 
                    transition duration-200"
            />

            <!-- Search Icon -->
            <svg
              class="absolute right-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M21 21l-4.35-4.35m1.85-5.65a7 7 0 11-14 0 7 7 0 0114 0z" />
            </svg>
          </div>



      <div class="flex items-center gap-4 rounded-full ">
         <!-- Machine Running -->
        <button
          (click)="openCreate()"
          class="inline-flex items-center gap-2 
                rounded-full bg-blue-600 px-5 py-2.5 
                text-sm font-medium text-white 
                shadow-md transition 
                hover:bg-blue-700 
                focus:outline-none focus:ring-2 focus:ring-blue-500">
          
          <svg class="w-4 h-4" fill="none" stroke="currentColor"
              stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M12 4v16m8-8H4"/>
          </svg>

          New Plants
        </button>

      </div>
   </div>
</div>




  <!-- SEARCH -->

  <!-- TABLE -->
  <div class="bg-white dark:bg-[#0f1c33] rounded-xl overflow-hidden">
    <table class="w-full text-sm">
      <thead class="bg-gray-50 dark:bg-[#12203a]">
        <tr>
          <th class="p-3 text-left">Code</th>
          <th class="p-3 text-left">Name</th>
          <th class="p-3 text-left">Location</th>
          <th class="p-3">Status</th>
          <th class="p-3">Action</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let r of rows" class="border-t dark:border-white/10">
          <td class="p-3">{{ r.plant_code }}</td>
          <td class="p-3">{{ r.plant_name }}</td>
          <td class="p-3">{{ r.location }}</td>

          <td class="p-3 text-center">
            <button (click)="toggle(r)" [class.bg-green-600]="r.is_active" [class.bg-gray-400]="!r.is_active"
              class="px-3 py-1 rounded-full text-white text-xs">
              {{ r.is_active ? 'Active' : 'Inactive' }}
            </button>
          </td>

          <td class="p-3 text-center">
            <button (click)="openEdit(r)" class="text-blue-600 hover:underline">
              Edit
            </button>
          </td>
        </tr>

        <tr *ngIf="rows.length === 0">
          <td colspan="5" class="p-6 text-center text-gray-400">
            No plants found
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- PAGINATION -->
  <div class="flex justify-end gap-3 mt-4 text-sm">
    <button (click)="prevPage()" [disabled]="page === 1" class="px-3 py-1 rounded bg-gray-200 dark:bg-[#12203a]">
      Prev
    </button>

    <span>{{ page }} / {{ totalPages() }}</span>

    <button (click)="nextPage()" [disabled]="page >= totalPages()"
      class="px-3 py-1 rounded bg-gray-200 dark:bg-[#12203a]">
      Next
    </button>

  </div>

  <!-- MODAL -->
  <app-plant-form *ngIf="showForm" [data]="editData" (close)="showForm=false" (saved)="onSaved()">
  </app-plant-form>

</div>
