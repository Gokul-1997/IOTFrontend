<header
  class="flex items-center justify-between px-6 py-4 border-b
         bg-white text-gray-900
         dark:bg-[#0b1628] dark:text-white dark:border-white/10">

  <!-- LEFT -->
  <div class="flex items-center gap-8">
    <img src="/images/logo/STM_logo.png" class="h-8" />

    <nav class="flex gap-2">

      <ng-container *ngFor="let menu of menus">

        <!-- NORMAL MENU -->
        <button
          *ngIf="!menu.children"
          (click)="navigate(menu)"
          class="nav-btn"
          [class.active]="isActive(menu.path)">
          {{ menu.label }}
        </button>

        <!-- MASTER MENU -->
        <div *ngIf="menu.children" class="relative">

          <button
            (click)="toggleMenu(menu.label)"
            class="nav-btn flex items-center gap-1"
            [class.active]="isChildActive(menu.children)">
            {{ menu.label }}
            <svg class="w-3 h-3 transition-transform"
                 [class.rotate-180]="openMenu === menu.label"
                 viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd"
                d="M5.23 7.21a.75.75 0 011.06.02L10 10.94l3.71-3.7a.75.75 0 111.06 1.06l-4.24 4.25a.75.75 0 01-1.06 0L5.21 8.29a.75.75 0 01.02-1.08z"/>
            </svg>
          </button>

          <!-- DROPDOWN -->
          <div
            *ngIf="openMenu === menu.label"
            class="submenu-card">

            <button
              *ngFor="let child of menu.children"
              (click)="navigate(child); closeMenu()"
              class="submenu-item"
              [class.active]="isActive(child.path)">
              {{ child.label }}
            </button>

          </div>
        </div>

      </ng-container>
    </nav>
  </div>

  <!-- RIGHT -->
  <div class="flex items-center gap-4">
    <button
      (click)="toggleTheme()"
      class="h-9 w-9 rounded-full flex items-center justify-center
             bg-gray-200 dark:bg-[#12203a]">
      {{ isDark ? '☀️' : '🌙' }}
    </button>

    <div class="flex items-center gap-2 rounded-full px-3 py-1
                bg-gray-200 dark:bg-[#12203a]">
      <img src="/images/user/owner.png" class="h-8 w-8 rounded-full" />
      <span class="text-sm font-medium">Admin</span>
    </div>
  </div>
</header>
