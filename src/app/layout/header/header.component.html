<header
  class="sticky top-0 w-full z-50 py-0 bg-white dark:bg-black">

  <div class="flex items-center justify-between px-4 xl:px-8 mx-auto h-16">

    <!-- LEFT -->
    <div class="flex items-center gap-4">
      <img src="/images/logo/STM_Mexa_logo.svg" class="w-32 dark:hidden" />
      <img src="/images/logo/STM_Mexa_logo.svg" class="w-32 hidden dark:block" alt="Logo" />
    </div>

    <!-- DESKTOP MENU -->
    <nav class="hidden lg:flex items-center gap-2">

      <ng-container *ngFor="let menu of menus">

        <!-- NORMAL MENU -->
        <button
          *ngIf="!menu.children"
          (click)="navigate(menu)"
          class="nav-btn flex items-center gap-1"
          [class.active]="isActive(menu.path)">
          <app-icon [name]="menu.icon" [size]="24" class="text-black dark:text-white"></app-icon>
          {{ menu.label }}
        </button>

        <!-- MASTER MENU -->
        <div *ngIf="menu.children" class="relative">

          <button
            (click)="toggleMenu(menu.label)"
            class="nav-btn flex items-center gap-1"
            [class.active]="isChildActive(menu.children)">
            <app-icon name="settings" [size]="24" class="text-black dark:text-white"></app-icon>
            {{ menu.label }}

            <svg class="w-3 h-3 transition-transform"
                 [class.rotate-180]="openMenu === menu.label"
                 viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd"
                d="M5.23 7.21a.75.75 0 011.06.02L10 10.94l3.71-3.7a.75.75 0 111.06 1.06l-4.24 4.25a.75.75 0 01-1.06 0L5.21 8.29a.75.75 0 01.02-1.08z"/>
            </svg>
          </button>

          <!-- DESKTOP DROPDOWN -->
          <div *ngIf="openMenu === menu.label"
               class="absolute mt-2 bg-white dark:bg-[#111] shadow-lg rounded-lg p-2 w-48">

            <button
              *ngFor="let child of menu.children"
              (click)="navigate(child); closeMenu()"
              class="block w-full text-left px-3 py-2 rounded hover:bg-gray-100 dark:hover:bg-gray-800"
              [class.active]="isActive(child.path)">
              {{ child.label }}
            </button>
          </div>
        </div>

      </ng-container>
    </nav>

    <!-- RIGHT SECTION -->
    <div class="flex items-center gap-3">

      <!-- THEME TOGGLE -->
      <button (click)="toggleTheme()" class="p-3 rounded-full bg-[#FFF0F8] dark:bg-[#111111]">
        <app-icon
          [name]="isDark ? 'sun' : 'moon'"
          [size]="20"
          class="text-gray-700 dark:text-white">
        </app-icon>
      </button>

      <!-- USER  -->
      <div class="hidden lg:flex items-center gap-2">
        <img src="/images/user/owner.png" class="h-9 w-9 rounded-full" />
        <span class="text-sm font-medium dark:text-white">Admin</span>
      </div>

      <!-- HAMBURGER  -->
      <button
        class="lg:hidden p-2"
        (click)="toggleMobileMenu()">

        <svg *ngIf="!isMobileMenuOpen"
             class="w-6 h-6 text-black dark:text-white"
             fill="none"
             stroke="currentColor"
             viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M4 6h16M4 12h16M4 18h16" />
        </svg>

        <svg *ngIf="isMobileMenuOpen"
             class="w-6 h-6 text-black dark:text-white"
             fill="none"
             stroke="currentColor"
             viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M6 18L18 6M6 6l12 12" />
        </svg>

      </button>

    </div>
  </div>

  <!-- MOBILE MENU -->
  <div *ngIf="isMobileMenuOpen"
       class="lg:hidden bg-white dark:bg-black border-t border-gray-200 dark:border-gray-800 px-4 py-4 space-y-3">

    <ng-container *ngFor="let menu of menus">

      <!-- NORMAL MENU -->
      <button
        *ngIf="!menu.children"
        (click)="navigate(menu); toggleMobileMenu()"
        class="block w-full text-left py-2 dark:text-white">
        {{ menu.label }}
      </button>

      <!-- MASTER MENU -->
      <div *ngIf="menu.children" class="space-y-2">

        <div class="font-medium dark:text-white">
          {{ menu.label }}
        </div>

        <button
          *ngFor="let child of menu.children"
          (click)="navigate(child); toggleMobileMenu()"
          class="block w-full text-left pl-4 py-1 text-sm text-gray-600 dark:text-gray-300">
          {{ child.label }}
        </button>

      </div>

    </ng-container>

  </div>

</header>
