<app-header></app-header>

<!--
  The gradient field every dashboard sits on. Putting it here rather than
  on each page means a screen cannot be added and quietly miss it, and the
  footer is written once instead of nine times.
-->
<div class="mexa-shell" [class.super-admin-shell]="auth.isSntSuper()">
  <div class="mexa-page">
    <router-outlet></router-outlet>
  </div>

  <footer class="mexa-footer">
    Copyright {{ year }}. All Rights Reserved <strong>STM Mexa</strong>.
  </footer>
</div>

<!-- "Are you sure?" for every page, in the same dialog card (ConfirmService) -->
<app-confirm-dialog></app-confirm-dialog>

<!-- the report assistant, bottom right, for people with report access (STM Mexa AI) -->
<app-assistant></app-assistant>
